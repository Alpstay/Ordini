<div id="app"></div>

<style>
  /* ============================================================
     AlpStay · Ordini — design standard AlpStay
     Verde bosco, crema, titoli condensati, micro-etichette spaziate
     ============================================================ */
  :root{
    --verde:#1F4234; --verde-scuro:#163327; --verde-tenue:#EAF0EA; --verde-punto:#2FA36B;
    --fondo:#F7F6F1; --carta:#FFFFFF; --crema:#F3F2E9;
    --inchiostro:#1C1C19; --testo:#3C3C37; --grigio:#8B8B80; --grigio-verde:#6E7B72;
    --linea:#E4E2D6; --linea-input:#D9D7C9;
    --rosso:#B3261E; --rosso-fondo:#FDECEB;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--fondo); font-family:'Poppins','Segoe UI',system-ui,-apple-system,sans-serif; color:var(--testo);}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,select{font-family:inherit; font-size:14px; color:var(--inchiostro);}
  input::placeholder{color:var(--grigio);}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--verde); outline-offset:1px;}
  svg{display:inline-block; vertical-align:middle;}
  .spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){ .spin{animation-duration:2.5s;} }

  .cond{font-family:'Oswald','Arial Narrow','Helvetica Neue Condensed','Impact',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.02em; color:var(--inchiostro);}

  /* --- barra di avanzamento --- */
  .metro{width:100%; height:8px; border-radius:999px; background:var(--linea); overflow:hidden;}
  .metro .mt-fill{display:block; height:100%; border-radius:999px; background:var(--verde); transition:width .25s;}

  /* --- testata --- */
  .topbar{position:sticky; top:0; z-index:20; background:var(--carta); border-bottom:1px solid var(--linea);}
  .topbar-in{max-width:42rem; margin:0 auto; padding:12px 16px;}
  .marchio-riga{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .marchio small{display:block; font-size:9px; font-weight:600; letter-spacing:.28em; text-transform:uppercase; color:var(--grigio-verde); margin-bottom:2px;}
  .marchio b{font-family:'Oswald','Arial Narrow','Helvetica Neue Condensed','Impact',sans-serif; font-weight:700; font-size:24px; letter-spacing:.02em; text-transform:uppercase; color:var(--inchiostro); line-height:1;}
  .salvato{display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--testo); white-space:nowrap;}
  .salvato i{width:8px; height:8px; border-radius:999px; background:var(--verde-punto);}
  .badge-err{font-size:10px; background:var(--rosso); color:#fff; padding:5px 10px; border-radius:8px;}

  main{max-width:42rem; margin:0 auto; padding:16px 16px 110px;}

  /* --- piè di pagina --- */
  .piepagina{margin-top:32px; padding:16px 0 4px; text-align:center; font-size:10px; font-weight:600; letter-spacing:.3em; text-transform:uppercase; color:var(--grigio);}

  /* --- navigazione inferiore --- */
  .bottomnav{position:fixed; bottom:0; left:0; right:0; background:var(--carta); border-top:1px solid var(--linea); z-index:20;}
  .bottomnav-in{max-width:42rem; margin:0 auto; display:flex; align-items:flex-end; padding:0 12px;}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 6px; margin:6px 4px; border-radius:12px; color:var(--grigio); font-size:11px; font-weight:600;}
  .tab.on{background:var(--verde); color:#fff;}
  .tab .fab{width:50px; height:50px; margin-top:-26px; border-radius:999px; background:var(--verde); color:#fff; display:flex; align-items:center; justify-content:center; border:4px solid var(--fondo); box-shadow:0 6px 14px rgba(31,66,52,.25);}
  .tab.fabtab{color:var(--verde);}
  .tab.fabtab.on{background:transparent;}

  /* --- titoli di sezione --- */
  .sez-tit{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .sez-tit em{font-style:normal; font-family:'Oswald','Arial Narrow','Helvetica Neue Condensed','Impact',sans-serif; font-weight:700; font-size:16px; letter-spacing:.03em; text-transform:uppercase; color:var(--inchiostro); white-space:nowrap; display:inline-flex; align-items:center; gap:6px;}
  .sez-tit .filo{flex:1; height:0; border-top:1px solid var(--linea);}
  .eyebrow{font-size:10px; font-weight:600; letter-spacing:.28em; text-transform:uppercase; color:var(--grigio-verde);}
  h2{font-family:'Oswald','Arial Narrow','Helvetica Neue Condensed','Impact',sans-serif; font-weight:700; font-size:26px; letter-spacing:.02em; text-transform:uppercase; color:var(--inchiostro); margin-top:2px;}

  /* --- card --- */
  .card{background:var(--carta); border:1px solid var(--linea); border-radius:14px;}
  .card-ordine{display:block; width:100%; text-align:left; padding:13px 14px; margin-bottom:8px; transition:border-color .12s;}
  .card-ordine:hover{border-color:var(--verde);}
  .co-riga{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .co-sx{display:flex; align-items:center; gap:10px; min-width:0;}
  .co-nome{font-weight:600; font-size:14px; color:var(--inchiostro); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .co-sub{font-size:11px; color:var(--grigio); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}
  .co-sub b{color:var(--verde); font-weight:600;}

  .mono{width:38px; height:38px; flex:none; background:var(--verde); color:#fff; font-weight:700; font-size:13px; letter-spacing:.05em; display:flex; align-items:center; justify-content:center; border-radius:10px;}
  .mono.sm{width:28px; height:28px; font-size:11px; border-radius:8px;}
  .mono.xl{width:48px; height:48px; font-size:17px; border-radius:12px;}

  .pill{font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding:5px 10px; border-radius:999px; white-space:nowrap;}
  .pill-aperto{border:1px solid var(--verde); color:var(--verde); background:var(--carta);}
  .pill-conf{background:var(--verde); color:#fff; border:1px solid var(--verde);}

  /* --- ricerca e filtri --- */
  .cerca{position:relative; margin-bottom:8px;}
  .cerca svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--grigio);}
  .cerca input{width:100%; padding:12px 12px 12px 38px; border:1px solid var(--linea-input); background:var(--carta); border-radius:12px;}

  .filtri-rapidi{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;}
  .filtri-rapidi select{width:100%; background:var(--carta); border:1px solid var(--linea-input); border-radius:10px; padding:10px 8px; font-size:13px;}
  .fr-data{display:flex; flex-direction:column; gap:3px; font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:var(--grigio-verde); font-weight:600;}
  .fr-data input{width:100%; background:var(--carta); border:1px solid var(--linea-input); border-radius:10px; padding:8px; font-size:13px;}

  .btn-mini{font-size:12px; font-weight:600; padding:8px 12px; background:var(--carta); border:1px solid var(--linea-input); border-radius:10px; color:var(--inchiostro); display:inline-flex; align-items:center; gap:6px;}
  .btn-mini.on{background:var(--verde); color:#fff; border-color:var(--verde);}

  .filtri{padding:12px; margin-bottom:8px; display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .filtri select{width:100%; background:var(--carta); border:1px solid var(--linea-input); border-radius:10px; padding:9px 8px; font-size:13px;}
  .filtri .azzera{grid-column:span 2; font-size:11px; letter-spacing:.06em; color:var(--grigio-verde); text-decoration:underline; padding:4px; font-weight:600;}

  .vuoto{border:1.5px dashed var(--linea-input); background:var(--crema); border-radius:14px; padding:24px; text-align:center; font-size:13px; color:var(--grigio);}
  .vuoto b{color:var(--verde);}

  /* --- pulsanti --- */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:600;}
  .btn-dark{background:var(--verde); color:#fff; padding:13px; font-size:14px; width:100%; border-radius:10px;}
  .btn-dark:hover{background:var(--verde-scuro);}
  .btn-dark:disabled{opacity:.4; cursor:default;}
  .btn-ghost{border:1px solid var(--linea-input); color:var(--inchiostro); background:var(--carta); padding:13px; font-size:14px; width:100%; border-radius:10px;}
  .btn-tratteggio{width:100%; padding:14px; border:1.5px dashed var(--verde); color:var(--verde); font-weight:600; font-size:13px; border-radius:12px; display:flex; align-items:center; justify-content:center; gap:8px; background:transparent;}
  .btn-cta{width:100%; padding:15px; background:var(--verde); color:#fff; font-weight:600; font-size:15px; border-radius:12px; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 6px 16px rgba(31,66,52,.28);}
  .btn-cta:hover{background:var(--verde-scuro);}
  .btn-cta:disabled{opacity:.4; box-shadow:none;}
  .btn-piccolo-dark{font-size:12px; font-weight:600; padding:8px 12px; background:var(--verde); color:#fff; border-radius:10px; display:inline-flex; align-items:center; gap:6px;}

  /* --- wizard --- */
  .step-testa{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
  .step-testa .indietro{padding:8px; margin-left:-8px; color:var(--inchiostro); border-radius:10px;}
  .step-testa .indietro:hover{background:var(--verde-tenue);}

  .scelta{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:14px; border:1px solid var(--linea); background:var(--carta); font-size:14px; font-weight:600; color:var(--inchiostro); border-radius:12px; margin-bottom:8px; transition:border-color .12s;}
  .scelta:hover{border-color:var(--verde);}
  .scelta.on{background:var(--verde); color:#fff; border-color:var(--verde);}
  .scelta.on .mono{background:#fff; color:var(--verde);}

  .form-inline{background:var(--crema); border:1.5px dashed var(--linea-input); border-radius:14px; padding:14px; margin-bottom:8px;}
  .form-inline input,.form-inline select{width:100%; padding:11px 12px; border:1px solid var(--linea-input); background:var(--carta); border-radius:8px; margin-bottom:8px;}
  .form-inline .righe-btn{display:flex; gap:8px;}
  .form-inline .righe-btn .btn{flex:1;}
  .pref-toggle{display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color:var(--verde); margin-bottom:10px; padding:2px 0;}

  .riga-forn{display:flex; align-items:center; border:1px solid var(--linea); background:var(--carta); border-radius:12px; margin-bottom:8px;}
  .riga-forn:hover{border-color:var(--verde);}
  .riga-forn.on{background:var(--verde); border-color:var(--verde);}
  .riga-forn .nomef{flex:1; text-align:left; padding:14px; font-size:14px; font-weight:600; color:var(--inchiostro);}
  .riga-forn.on .nomef{color:#fff;}
  .riga-forn .telef{font-size:11px; color:var(--grigio); margin-left:8px; font-weight:400;}
  .riga-forn.on .telef{color:var(--verde-tenue);}
  .riga-forn .stellabtn{padding:12px; color:var(--verde);}
  .riga-forn.on .stellabtn{color:#fff;}

  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
  .chip{font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding:5px 10px; border:1px solid var(--linea); background:var(--carta); color:var(--testo); border-radius:999px;}
  .chip.forte{background:var(--verde-tenue); border-color:var(--verde); color:var(--verde);}

  .mini-badge{font-size:9px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; padding:2px 7px; border:1px solid var(--linea); background:var(--carta); color:var(--grigio); border-radius:6px; margin-right:4px; display:inline-block; margin-top:4px;}
  .mini-badge.forte{background:var(--verde-tenue); border-color:var(--verde); color:var(--verde);}

  /* --- dettaglio ordine --- */
  .testa-ordine{background:var(--carta); border:1px solid var(--linea); border-radius:16px; padding:16px; margin-bottom:14px;}
  .to-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .to-sx{display:flex; gap:12px; min-width:0;}
  .to-nome{font-family:'Oswald','Arial Narrow','Helvetica Neue Condensed','Impact',sans-serif; font-weight:700; font-size:20px; letter-spacing:.02em; text-transform:uppercase; color:var(--inchiostro); line-height:1.15;}
  .to-sub{font-size:12px; color:var(--grigio); margin-top:3px;}
  .to-sub b{color:var(--verde);}
  .to-meta{font-size:10px; color:var(--grigio); margin-top:5px;}
  .prog-etic{display:flex; justify-content:space-between; align-items:baseline; margin:14px 0 6px;}
  .prog-etic span{font-size:9px; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--grigio-verde);}
  .prog-etic b{font-size:15px; font-weight:700; color:var(--inchiostro);}

  .suggerimento{font-size:12px; color:var(--grigio); margin:0 2px 10px;}

  .riga-check{border:1px solid var(--linea); background:var(--carta); border-radius:14px; padding:12px; margin-bottom:8px; transition:background .12s,border-color .12s;}
  .riga-check.ok{background:var(--verde-tenue); border-color:var(--verde);}
  .rc-corpo{display:flex; align-items:flex-start; gap:12px;}
  .rc-btn{flex:none; width:46px; height:46px; border-radius:999px; border:2px solid var(--verde); background:var(--carta); color:var(--verde); font-size:8px; font-weight:700; letter-spacing:.1em; display:flex; align-items:center; justify-content:center; transition:all .12s;}
  .rc-btn.ok{background:var(--verde); color:#fff;}
  .rc-btn:disabled{opacity:.5; cursor:default;}
  .rc-info{flex:1; min-width:0;}
  .rc-nome{font-weight:600; font-size:14px; color:var(--inchiostro); line-height:1.3;}
  .rc-orario{font-size:10px; letter-spacing:.04em; color:var(--verde); margin-top:4px; font-weight:600;}
  .rc-nota{font-size:11px; color:var(--grigio); margin-top:4px; display:inline-flex; align-items:center; gap:4px;}
  .rc-dx{flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:6px;}
  .qta{display:flex; align-items:center; gap:4px;}
  .qta button{width:28px; height:28px; border:1px solid var(--linea-input); background:var(--carta); font-weight:700; border-radius:8px;}
  .qta span{font-size:12px; font-weight:700; min-width:44px; text-align:center; color:var(--inchiostro);}
  .mini-azioni{display:flex; gap:4px;}
  .mini-azioni button{padding:6px; color:var(--grigio); border-radius:8px;}
  .mini-azioni button:hover{color:var(--verde); background:var(--verde-tenue);}
  .input-nota{width:100%; margin-top:6px; padding:8px; border:1px solid var(--linea-input); background:var(--carta); border-radius:8px; font-size:13px;}

  .avviso-conferma{background:var(--carta); border:1.5px solid var(--verde); border-radius:14px; padding:14px;}
  .avviso-conferma p{font-size:13px; color:var(--testo); margin-bottom:10px;}

  /* --- picker prodotti --- */
  .picker-riga{border:1px solid var(--linea); background:var(--carta); border-radius:12px; margin-bottom:6px; transition:border-color .12s;}
  .picker-riga.on{border-color:var(--verde); background:#FBFDFB;}
  .pk-btn{width:100%; text-align:left; padding:10px 12px; display:flex; align-items:flex-start; gap:10px;}
  .pk-box{margin-top:1px; width:22px; height:22px; border:1.5px solid var(--verde); background:var(--carta); flex:none; display:flex; align-items:center; justify-content:center; color:#fff; border-radius:6px;}
  .pk-box.on{background:var(--verde);}
  .pk-nome{font-weight:600; font-size:13px; color:var(--inchiostro); display:block;}
  .pk-det{padding:0 12px 10px 44px; display:flex; flex-wrap:wrap; align-items:center; gap:8px;}
  .pk-det select{border:1px solid var(--linea-input); padding:6px; font-size:12px; background:var(--carta); border-radius:8px;}
  .pk-det .nota-riga{flex:1; min-width:120px; border:1px solid var(--linea-input); padding:6px 8px; font-size:12px; background:var(--carta); border-radius:8px;}
  .pk-lista{max-height:50vh; overflow-y:auto; padding-right:4px;}
  .pk-conteggio{margin-top:10px; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--verde);}
  .link-scuro{font-size:12px; font-weight:600; color:var(--verde); text-decoration:underline; display:inline-flex; align-items:center; gap:4px; margin-bottom:10px;}

  /* --- preferiti prodotto --- */
  .pk-testa{display:flex; align-items:flex-start;}
  .pk-testa .pk-btn{flex:1; min-width:0;}
  .stellina{padding:10px; color:var(--verde); flex:none;}
  .pk-gruppo{font-size:9px; font-weight:600; letter-spacing:.24em; text-transform:uppercase; color:var(--grigio-verde); margin:8px 2px 6px;}
  .pref-lista{max-height:40vh; overflow-y:auto; padding-right:4px;}
  .pref-riga{display:flex; align-items:flex-start; gap:10px; border:1px solid var(--linea); background:var(--carta); border-radius:12px; padding:10px 12px; margin-bottom:6px;}
  .pref-riga.on{border-color:var(--verde); background:#FBFDFB;}
  .pref-riga .pk-box{margin-top:1px;}
  .pref-riga .testo{flex:1; text-align:left; min-width:0; padding:0;}
  .pref-riga .stellina{padding:2px 0 0;}

  .fascia-cta{position:fixed; bottom:70px; left:0; right:0; padding:0 16px; z-index:15;}
  .fascia-cta > div{max-width:42rem; margin:0 auto;}

  /* --- catalogo / bolla --- */
  .card-bolla{padding:16px; margin-bottom:14px; background:var(--crema); border:1.5px dashed var(--linea-input); border-radius:16px;}
  .card-bolla h3{font-family:'Oswald','Arial Narrow','Helvetica Neue Condensed','Impact',sans-serif; font-weight:700; font-size:16px; letter-spacing:.03em; text-transform:uppercase; color:var(--inchiostro); display:flex; align-items:center; gap:8px;}
  .card-bolla .desc{font-size:12px; color:var(--grigio); margin:6px 0 12px;}
  .err-box{font-size:12px; color:var(--rosso); background:var(--rosso-fondo); border:1px solid var(--rosso); border-radius:10px; padding:8px 12px; margin-bottom:8px;}
  .err-det{font-size:10px; color:#8A5B58; margin-top:4px; word-break:break-word;}
  .bolla-item{display:flex; align-items:center; gap:8px; border:1px solid var(--linea-input); border-radius:10px; padding:6px 8px; margin-bottom:6px; background:var(--carta);}
  .bolla-item.esiste{background:var(--fondo); opacity:.6;}
  .bolla-item input{flex:1; border:none; background:transparent; font-size:12px; min-width:0;}
  .bolla-item select{font-size:11px; border:1px solid var(--linea-input); border-radius:6px; padding:4px; background:var(--carta); max-width:110px;}
  .bolla-item .gia{font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--grigio); white-space:nowrap;}
  .bolla-check{width:22px; height:22px; border:1.5px solid var(--verde); background:var(--carta); flex:none; display:flex; align-items:center; justify-content:center; color:#fff; border-radius:6px;}
  .bolla-check.on{background:var(--verde);}
  .bolla-check:disabled{border-color:var(--linea-input);}
  .bolla-lista{max-height:256px; overflow-y:auto; padding-right:4px;}
  .bolla-forn{width:100%; padding:10px 12px; border:1px solid var(--linea-input); background:var(--carta); border-radius:10px; margin:8px 0;}
  .caricamento{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--grigio-verde); padding:8px 0;}

  /* --- zona drag & drop bolla --- */
  .dropzone{border:2px dashed var(--verde); border-radius:14px; background:var(--carta); padding:28px 16px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; cursor:pointer; color:var(--verde); transition:background .12s, border-color .12s, transform .12s;}
  .dropzone > *{pointer-events:none;}
  .dropzone b{font-size:14px; color:var(--inchiostro); font-weight:600;}
  .dropzone span{font-size:11px; color:var(--grigio);}
  .dropzone:hover{background:#FBFDFB;}
  .dropzone.trascina{background:var(--verde-tenue); border-color:var(--verde-scuro); transform:scale(1.01);}

  .cat-testa{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .cat-testa h3{font-family:'Oswald','Arial Narrow','Helvetica Neue Condensed','Impact',sans-serif; font-weight:700; font-size:16px; letter-spacing:.03em; text-transform:uppercase; color:var(--inchiostro); display:flex; align-items:center; gap:8px;}
  .cat-chips{display:flex; gap:6px; overflow-x:auto; padding:0 2px 8px; margin-bottom:8px;}
  .cat-chips button{flex:none; font-size:11px; font-weight:600; padding:7px 12px; border:1px solid var(--linea-input); background:var(--carta); color:var(--testo); border-radius:999px;}
  .cat-chips button.on{background:var(--verde); color:#fff; border-color:var(--verde);}
  .prod-card{background:var(--carta); border:1px solid var(--linea); border-radius:12px; padding:10px 12px; margin-bottom:6px;}
  .prod-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .prod-nome{font-weight:600; font-size:13px; color:var(--inchiostro);}

const RADICE = "alpstay-ordini";
async function caricaChiave(chiave, fallback){
  try{
    const snap = await rtdb.ref(RADICE+"/"+chiave).once("value");
    const v = snap.val();
    if(v) return JSON.parse(v);
  }catch(e){ /* dato assente o non raggiungibile: uso i dati iniziali */ }
  return fallback;
}
async function salva(chiave, valore){
  try{
    await rtdb.ref(RADICE+"/"+chiave).set(JSON.stringify(valore));
    st.erroreSalvataggio = false;
    st.ultimoSalvataggio = new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
    const el = document.getElementById("salvato-ind");
    if(el){ el.classList.remove("hidden"); el.innerHTML = '<i></i>Salvato alle '+st.ultimoSalvataggio; }
  }catch(e){ st.erroreSalvataggio = true; }
}

  if(f) h += '<span class="mini-badge forte">'+esc(f.nome)+(p.ultimaData?' · '+fmtData(p.ultimaData):'')+'</span>';

}

function ordiniFiltrati(){
  const fl = st.filtri;
  return st.ordini.filter(o=>{
    if(fl.strutturaId && o.strutturaId!==fl.strutturaId) return false;
    if(fl.repartoId && o.repartoId!==fl.repartoId) return false;
    if(fl.fornitoreId && o.fornitoreId!==fl.fornitoreId) return false;
    if(fl.stato && o.stato!==fl.stato) return false;
    if(fl.dal && new Date(o.data) < new Date(fl.dal)) return false;
    if(fl.al && new Date(o.data) > new Date(fl.al+"T23:59:59")) return false;
    if(fl.testo){
      const t = norm(fl.testo);
      const inRighe = o.righe.some(r=>norm(r.nome).includes(t)||norm(r.nota).includes(t));
      const inTesta = norm(o.numero).includes(t)||norm(struttura(o.strutturaId)?.nome).includes(t)||norm(fornitore(o.fornitoreId)?.nome).includes(t);
      if(!inRighe && !inTesta) return false;
    }
    return true;
  });
}

    const opz = (lista, val, render) => lista.map(x=>'<option value="'+x.id+'"'+(val===x.id?' selected':'')+'>'+render(x)+'</option>').join("");
    h += '<div class="card filtri">'
      +'<select data-fid="f-str" onchange="A.setFiltro(\'strutturaId\', this.value)"><option value="">Tutte le strutture</option>'+opz(st.config.strutture, st.filtri.strutturaId, x=>esc(x.nome))+'</select>'
      +'<select data-fid="f-rep" onchange="A.setFiltro(\'repartoId\', this.value)"><option value="">Tutti i reparti</option>'+opz(st.config.reparti, st.filtri.repartoId, x=>esc(x.nome))+'</select>'
      +'<select data-fid="f-sta" style="grid-column:span 2" onchange="A.setFiltro(\'stato\', this.value)"><option value="">Tutti gli stati</option><option value="aperto"'+(st.filtri.stato==="aperto"?" selected":"")+'>Aperto</option><option value="confermato"'+(st.filtri.stato==="confermato"?" selected":"")+'>Confermato</option></select>'
      +'<button class="azzera" onclick="A.azzeraFiltri()">Azzera filtri</button>'
      +'</div>';
  }

  h += filtrati.length
    ? filtrati.map(cardOrdine).join("")
    : '<div class="vuoto">Nessun ordine trovato. Crea il primo ordine con <b>Nuovo</b>.</div>';

  return h+'</section>';
}

/* ---------- Nuovo ordine (wizard) ---------- */
function stepTesta(titolo){
  return '<div class="step-testa">'
    +(st.step>0?'<button class="indietro" onclick="A.stepIndietro()">'+ico("chevS",18)+'</button>':'')
    +'<div><div class="eyebrow">Nuovo ordine · passo '+(st.step+1)+' / 4</div><h2>'+titolo+'</h2></div></div>';
}

function vNuovo(){
  if(st.step===0){
    let h = stepTesta("Struttura");
    h += st.config.strutture.map(s=>
      '<button class="scelta'+(st.draft.strutturaId===s.id?' on':'')+'" onclick="A.scegliStruttura(\''+s.id+'\')"><span class="mono sm">'+esc(mono(s.nome))+'</span>'+esc(s.nome)+'</button>'
    ).join("");
    if(st.nuovaStruttura===null){
      h += '<button class="btn-tratteggio" onclick="A.apriNuovaStruttura()">'+ico("piu",16)+' Aggiungi struttura / esercizio</button>';
    } else {
      h += '<div class="form-inline">'
        +'<input data-fid="ns-nome" placeholder="Nome struttura (es. Chalet Pieve)" value="'+esc(st.nuovaStruttura.nome)+'" oninput="A.setNuovaStruttura(this.value)">'
        +'<div class="righe-btn"><button class="btn btn-ghost" onclick="A.chiudiForm(\'nuovaStruttura\')">Annulla</button>'
        +'<button class="btn btn-dark" onclick="A.salvaNuovaStruttura()">Salva e continua</button></div></div>';
    }
    return h;
  }
  if(st.step===1){
    let h = stepTesta("Reparto");
    h += st.config.reparti.map(r=>
      '<button class="scelta'+(st.draft.repartoId===r.id?' on':'')+'" onclick="A.scegliReparto(\''+r.id+'\')">'+esc(r.nome)+'</button>'
    ).join("");
    if(st.nuovoReparto===null){
      h += '<button class="btn-tratteggio" onclick="A.apriNuovoReparto()">'+ico("piu",16)+' Aggiungi reparto</button>';
    } else {
      h += '<div class="form-inline">'
        +'<input data-fid="nr-nome" placeholder="Nome reparto" value="'+esc(st.nuovoReparto.nome)+'" oninput="A.setNuovoReparto(this.value)">'
        +'<div class="righe-btn"><button class="btn btn-ghost" onclick="A.chiudiForm(\'nuovoReparto\')">Annulla</button>'
        +'<button class="btn btn-dark" onclick="A.salvaNuovoReparto()">Salva e continua</button></div></div>';
    }
    return h;
  }
  if(st.step===2){
    const pref = st.config.fornitori.filter(f=>f.preferito);
    const altri = st.config.fornitori.filter(f=>!f.preferito);
    const riga = (f)=>'<div class="riga-forn'+(st.draft.fornitoreId===f.id?' on':'')+'">'
      +'<button class="nomef" onclick="A.scegliFornitore(\''+f.id+'\')">'+esc(f.nome)
      +(f.telefono?'<span class="telef">'+ico("tel",11)+' '+esc(f.telefono)+'</span>':'')+'</button>'
      +'<button class="stellabtn" title="Preferito" onclick="A.togglePreferito(\''+f.id+'\')">'+stella(f.preferito)+'</button></div>';
    let h = stepTesta("Fornitore");
    if(pref.length) h += sezTit("Preferiti")+pref.map(riga).join("");
    if(altri.length) h += '<div class="mt8">'+sezTit("Altri fornitori")+altri.map(riga).join("")+'</div>';
    if(st.nuovoFornitore===null){
      h += '<button class="btn-tratteggio mt8" onclick="A.apriNuovoFornitore()">'+ico("piu",16)+' Aggiungi fornitore</button>';
    } else {
      const nf = st.nuovoFornitore;
      h += '<div class="form-inline mt8">'
        +'<input data-fid="nf-nome" placeholder="Nome fornitore" value="'+esc(nf.nome)+'" oninput="A.setNuovoFornitore(\'nome\', this.value)">'
        +'<input data-fid="nf-tel" placeholder="Telefono (facoltativo)" value="'+esc(nf.telefono)+'" oninput="A.setNuovoFornitore(\'telefono\', this.value)">'
        +'<button class="pref-toggle" onclick="A.setNuovoFornitore(\'preferito\', !'+nf.preferito+')">'+stella(nf.preferito,16)+' Segna come preferito</button>'
        +'<div class="righe-btn"><button class="btn btn-ghost" onclick="A.chiudiForm(\'nuovoFornitore\')">Annulla</button>'
        +'<button class="btn btn-dark" onclick="A.salvaNuovoFornitore()">Salva e continua</button></div></div>';
    }
    return h;
  }
  /* passo 4 · prodotti */
  st.pickerCtx = { tipo:"draft" };
  let h = stepTesta("Prodotti");
  h += '<div class="chips">'
    +'<span class="chip">'+esc(struttura(st.draft.strutturaId)?.nome||"")+'</span>'
    +'<span class="chip">'+esc(reparto(st.draft.repartoId)?.nome||"")+'</span>'
    +'<span class="chip forte">'+esc(fornitore(st.draft.fornitoreId)?.nome||"")+'</span></div>';
  h += picker();
  h += '<div class="spazio"></div>';
  h += '<div class="fascia-cta"><div><button class="btn-cta" '+(st.draft.righe.length?'':'disabled ')+'onclick="A.creaOrdine()">'
    +ico("lista",16)+' Crea lista ordine · '+st.draft.righe.length+'</button></div></div>';
  return h;
}

/* ---------- Picker prodotti (wizard + dettaglio) ---------- */
function righeCorrenti(){
  if(st.pickerCtx.tipo==="draft") return st.draft.righe;
  const o = st.ordini.find(x=>x.id===st.pickerCtx.id);
  return o ? o.righe : [];
}
function impostaRighe(righe){
  if(st.pickerCtx.tipo==="draft"){ st.draft.righe = righe; }
  else{
    st.ordini = st.ordini.map(o=>o.id===st.pickerCtx.id?{...o, righe}:o);
    salvaOrdini();
  }
}

function picker(){
  const t = norm(st.cercaPicker);
  const righe = righeCorrenti();
  const sel = new Set(righe.map(r=>r.prodottoId));
  const prodotti = st.catalogo.filter(p=>!t||norm(p.nome).includes(t)).sort((a,b)=>a.nome.localeCompare(b.nome));

  let h = '<div class="cerca">'+ico("cerca",15)
    +'<input data-fid="pk-cerca" value="'+esc(st.cercaPicker)+'" placeholder="Cerca prodotto…" oninput="A.setCercaPicker(this.value)"></div>';

  if(st.rapido===null){
    h += '<button class="link-scuro" onclick="A.apriRapido()">'+ico("piu",11)+' Il prodotto non c\'è? Aggiungilo al volo</button>';
  } else {
    h += '<div class="form-inline">'
      +'<input data-fid="rp-nome" placeholder="Nome nuovo prodotto" value="'+esc(st.rapido.nome)+'" oninput="A.setRapido(\'nome\', this.value)">'
      +'<select data-fid="rp-cat" onchange="A.setRapido(\'categoria\', this.value)">'+CATEGORIE.map(c=>'<option'+(st.rapido.categoria===c?' selected':'')+'>'+c+'</option>').join("")+'</select>'
      +'<div class="righe-btn"><button class="btn btn-ghost" onclick="A.chiudiForm(\'rapido\')">Annulla</button>'
      +'<button class="btn btn-dark" onclick="A.salvaRapido()">Aggiungi</button></div></div>';
  }

  const rendiRiga = (p)=>{
    const on = sel.has(p.id);
    const riga = righe.find(r=>r.prodottoId===p.id);
    let x = '<div class="picker-riga'+(on?' on':'')+'"><div class="pk-testa">'
      +'<button class="pk-btn" onclick="A.togglePicker(\''+p.id+'\')">'
      +'<span class="pk-box'+(on?' on':'')+'">'+(on?ico("check",14):'')+'</span>'
      +'<span style="min-width:0"><span class="pk-nome">'+esc(p.nome)+'</span>'+infoProdotto(p)+'</span></button>'
      +'<button class="stellina" title="Preferito" onclick="A.togglePrefProd(\''+p.id+'\')">'+stella(!!p.preferito,15)+'</button></div>';
    if(on && riga){
      x += '<div class="pk-det">'
        +'<span class="qta"><button onclick="A.qtaPicker(\''+riga.id+'\',-1)">−</button><span style="min-width:28px">'+riga.quantita+'</span><button onclick="A.qtaPicker(\''+riga.id+'\',1)">+</button></span>'
        +'<select onchange="A.unitaPicker(\''+riga.id+'\', this.value)">'+UNITA.map(u=>'<option'+(riga.unita===u?' selected':'')+'>'+u+'</option>').join("")+'</select>'
        +'<input class="nota-riga" data-fid="pk-nota-'+riga.id+'" placeholder="Nota riga…" value="'+esc(riga.nota)+'" oninput="A.notaPicker(\''+riga.id+'\', this.value)">'
        +'</div>';
    }
    return x+'</div>';
  };
  h += '<div class="pk-lista">';
  if(!prodotti.length) h += '<div class="vuoto">Nessun prodotto trovato. Aggiungilo al volo qui sopra.</div>';
  const prefP = prodotti.filter(p=>p.preferito), altriP = prodotti.filter(p=>!p.preferito);
  if(prefP.length) h += '<div class="pk-gruppo">Preferiti</div>'+prefP.map(rendiRiga).join("");
  if(prefP.length && altriP.length) h += '<div class="pk-gruppo">Tutti i prodotti</div>';
  h += altriP.map(rendiRiga).join("");
  h += '</div>';
  if(righe.length) h += '<div class="pk-conteggio">'+righe.length+' prodotti nella lista</div>';
  return h;
}

/* ---------- Dettaglio ordine (checklist) ---------- */
function vDettaglio(){
  const o = st.ordini.find(x=>x.id===st.vista.ordineId);
  if(!o) return '<div class="vuoto">Ordine non trovato.</div>';
  const s = struttura(o.strutturaId), r = reparto(o.repartoId), f = fornitore(o.fornitoreId);
  const fatti = o.righe.filter(x=>x.ordinato).length;
  const aperto = o.stato==="aperto";
  const pct = o.righe.length ? (fatti/o.righe.length*100) : 0;

  let h = '<button class="indietro-link" onclick="A.tornaOrdini()">'+ico("frecciaS",14)+' Ordini</button>';

  h += '<div class="testa-ordine"><div class="to-top"><div class="to-sx">'
    +'<span class="mono xl">'+esc(mono(s?.nome))+'</span>'
    +'<div style="min-width:0"><div class="to-nome">'+esc(s?.nome||"Struttura")+'</div>'
    +'<div class="to-sub">'+esc(r?.nome||"")+' · fornitore <b>'+esc(f?.nome||"")+'</b></div>'
    +'<div class="to-meta">'+esc(o.numero)+' · creato '+fmtData(o.data)+' '+fmtOra(o.data)
    +(o.confermatoAt?' · confermato '+fmtData(o.confermatoAt)+' '+fmtOra(o.confermatoAt):'')+'</div></div></div>'
    +'<span class="pill '+(aperto?'pill-aperto':'pill-conf')+'">'+(aperto?'Aperto':'Confermato')+'</span></div>'
    +'<div class="prog-etic"><span>Prodotti ordinati</span><b>'+fatti+' / '+o.righe.length+'</b></div>'
    +metro(pct)+'</div>';

  if(aperto) h += '<p class="suggerimento">Leggi i prodotti al rappresentante e tocca il cerchio quando l\'articolo è stato ordinato.</p>';

  o.righe.forEach(rg=>{
    const p = st.catalogo.find(x=>x.id===rg.prodottoId);
    h += '<div class="riga-check'+(rg.ordinato?' ok':'')+'"><div class="rc-corpo">'
      +'<button class="rc-btn'+(rg.ordinato?' ok':'')+'" '+(aperto?'':'disabled ')+'onclick="A.toggleRiga(\''+o.id+'\',\''+rg.id+'\')">'
      +(rg.ordinato?ico("check",22):'ORDINA')+'</button>'
      +'<div class="rc-info"><div class="rc-nome">'+esc(rg.nome)+'</div>'
      +(p?infoProdotto(p):'')
      +(rg.nota && st.notaAperta!==rg.id ? '<div class="rc-nota">'+ico("nota",11)+' '+esc(rg.nota)+'</div>' : '')
      +(st.notaAperta===rg.id ? '<input class="input-nota" data-fid="nota-'+rg.id+'" placeholder="Nota per questa riga…" value="'+esc(rg.nota||"")+'" oninput="A.setNotaRiga(\''+o.id+'\',\''+rg.id+'\', this.value)" onblur="A.chiudiNota()">' : '')
      +(rg.ordinato && rg.ordinatoAt ? '<div class="rc-orario">Ordinato alle '+fmtOra(rg.ordinatoAt)+'</div>' : '')
      +'</div><div class="rc-dx"><div class="qta">'
      +(aperto?'<button onclick="A.qtaRiga(\''+o.id+'\',\''+rg.id+'\',-1)">−</button>':'')
      +'<span>'+rg.quantita+' '+esc(rg.unita)+'</span>'
      +(aperto?'<button onclick="A.qtaRiga(\''+o.id+'\',\''+rg.id+'\',1)">+</button>':'')
      +'</div>'
      +(aperto?'<div class="mini-azioni"><button onclick="A.apriNota(\''+rg.id+'\')">'+ico("matita",14)+'</button><button onclick="A.rimuoviRiga(\''+o.id+'\',\''+rg.id+'\')">'+ico("cestino",14)+'</button></div>':'')
      +'</div></div></div>';
  });

  if(aperto){
    if(!st.aggiungiProdotti){
      h += '<button class="btn-tratteggio mt8" onclick="A.apriAggiungiProdotti()">'+ico("piu",14)+' Aggiungi prodotti alla lista</button>';
    } else {
      st.pickerCtx = { tipo:"ordine", id:o.id };
      h += '<div class="form-inline mt8"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
        +'<b style="font-size:11px;letter-spacing:.14em;text-transform:uppercase">Aggiungi prodotti</b><button style="color:var(--grigio);padding:4px" onclick="A.chiudiAggiungiProdotti()">'+ico("x",16)+'</button></div>'
        +picker()+'</div>';
    }
    if(!st.confermaVisibile){
      h += '<button class="btn-cta mt12" onclick="A.mostraConferma()">'+ico("okCerchio",16)+' Conferma ordine</button>';
    } else {
      const msg = fatti < o.righe.length
        ? 'Attenzione: '+(o.righe.length-fatti)+' prodotti non sono ancora segnati come ordinati. Confermare comunque?'
        : 'Tutti i prodotti sono stati ordinati. Confermare e chiudere l\'ordine?';
      h += '<div class="avviso-conferma mt12"><p>'+msg+'</p><div style="display:flex;gap:8px">'
        +'<button class="btn btn-ghost" style="flex:1" onclick="A.nascondiConferma()">Annulla</button>'
        +'<button class="btn btn-dark" style="flex:1" onclick="A.confermaOrdine(\''+o.id+'\')">Conferma</button></div></div>';
    }
  } else {
    h += '<button class="btn-tratteggio mt12" onclick="A.riapriOrdine(\''+o.id+'\')">'+ico("riapri",14)+' Riapri ordine</button>';
  }
  return h;
}

/* ---------- Catalogo ---------- */
function vCatalogo(){
  const t = norm(st.cercaCat);
  const prodotti = st.catalogo
    .filter(p=>(!st.catFiltro||p.categoria===st.catFiltro)&&(!t||norm(p.nome).includes(t)))
    .sort((a,b)=>a.nome.localeCompare(b.nome));
  const b = st.bolla;

  let h = '<div class="card card-bolla"><h3>'+ico("doc",15)+' Carica bolla d\'acquisto</h3>'
    +'<p class="desc">Trascina il PDF della bolla nella zona qui sotto (o toccala per scegliere un file): i prodotti vengono letti in automatico e aggiunti al catalogo, così restano memorizzati per gli ordini futuri.</p>';
  if(b.errore) h += '<div class="err-box">'+esc(b.errore)
    +(b.dettaglio?'<div class="err-det">Dettaglio tecnico: '+esc(b.dettaglio)+'</div>':'')
    +'</div>';

  if(b.fase==="idle"){
    h += '<input id="file-bolla" type="file" accept="image/*,application/pdf" class="hidden" onchange="A.fileBolla(this)">'
      +'<div class="dropzone" id="dropzone-bolla" onclick="document.getElementById(\'file-bolla\').click()" '
      +'ondragover="A.dragBolla(event,true)" ondragenter="A.dragBolla(event,true)" ondragleave="A.dragBolla(event,false)" ondrop="A.dropBolla(event)">'
      +ico("carica",26)
      +'<b>Trascina qui il PDF della bolla</b>'
      +'<span>oppure tocca per scegliere un file — PDF o foto</span>'
      +'</div>';
  } else if(b.fase==="caricamento"){
    h += '<div class="caricamento"><span class="spin">'+ico("giro",16)+'</span> Lettura della bolla in corso…</div>';
  } else {
    h += '<div style="font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px">Prodotti trovati — seleziona quelli da salvare</div><div class="bolla-lista">';
    b.items.forEach((i,idx)=>{
      h += '<div class="bolla-item'+(i.esiste?' esiste':'')+'">'
        +'<button class="bolla-check'+(i.selezionato?' on':'')+'" '+(i.esiste?'disabled ':'')+'onclick="A.toggleBolla('+idx+')">'+(i.selezionato?ico("check",14):'')+'</button>'
        +'<input data-fid="bi-'+idx+'" value="'+esc(i.nome)+'" oninput="A.nomeBolla('+idx+', this.value)">'
        +(i.esiste
          ? '<span class="gia">già nel catalogo</span>'
          : '<select onchange="A.catBolla('+idx+', this.value)">'+CATEGORIE.map(c=>'<option'+(i.categoria===c?' selected':'')+'>'+c+'</option>').join("")+'</select>')
        +'</div>';
    });
    h += '</div><select class="bolla-forn" onchange="A.fornBolla(this.value)"><option value="">Fornitore della bolla (facoltativo)</option>'
      +st.config.fornitori.map(f=>'<option value="'+f.id+'"'+(b.fornitoreId===f.id?' selected':'')+'>'+esc(f.nome)+'</option>').join("")+'</select>'
      +'<div style="display:flex;gap:8px"><button class="btn btn-ghost" style="flex:1" onclick="A.annullaBolla()">Annulla</button>'
      +'<button class="btn btn-dark" style="flex:1" onclick="A.salvaBolla()">Salva '+b.items.filter(i=>i.selezionato&&!i.esiste).length+' prodotti</button></div>';
  }
  h += '</div>';

  h += '<div class="cat-testa"><h3>'+ico("pacco",15)+' Catalogo · '+st.catalogo.length+'</h3>'
    +'<button class="btn-piccolo-dark" onclick="A.apriNuovoProd()">'+ico("piu",11)+' Prodotto</button></div>';

  if(st.nuovoProd){
    h += '<div class="form-inline">'
      +'<input data-fid="np-nome" placeholder="Nome prodotto" value="'+esc(st.nuovoProd.nome)+'" oninput="A.setNuovoProd(\'nome\', this.value)">'
      +'<select data-fid="np-cat" onchange="A.setNuovoProd(\'categoria\', this.value)">'+CATEGORIE.map(c=>'<option'+(st.nuovoProd.categoria===c?' selected':'')+'>'+c+'</option>').join("")+'</select>'
      +'<div class="righe-btn"><button class="btn btn-ghost" onclick="A.chiudiForm(\'nuovoProd\')">Annulla</button>'
      +'<button class="btn btn-dark" onclick="A.salvaNuovoProd()">Salva</button></div></div>';
  }

  h += '<div class="cerca">'+ico("cerca",15)
    +'<input data-fid="cat-cerca" value="'+esc(st.cercaCat)+'" placeholder="Cerca nel catalogo…" oninput="A.setCercaCat(this.value)"></div>';
  h += '<div class="cat-chips"><button class="'+(!st.catFiltro?'on':'')+'" onclick="A.setCatFiltro(\'\')">Tutte</button>'
    +CATEGORIE.map(c=>'<button class="'+(st.catFiltro===c?'on':'')+'" onclick="A.setCatFiltro(\''+c+'\')">'+c+'</button>').join("")+'</div>';

  if(!prodotti.length) h += '<div class="vuoto">Nessun prodotto trovato.</div>';
  prodotti.forEach(p=>{
    h += '<div class="prod-card"><div class="prod-top"><div style="min-width:0;flex:1">'
      +'<div class="prod-nome">'+esc(p.nome)+'</div>'
      +'<div class="prod-cat">'+esc(p.categoria)+(p.origine==="bolla"?' · da bolla':'')+'</div>'
      +infoProdotto(p)
      +(st.editProd===p.id ? '<input class="input-nota" data-fid="ep-'+p.id+'" placeholder="Nota fissa del prodotto (es. solo formato 24 pz)…" value="'+esc(p.note)+'" oninput="A.notaProdotto(\''+p.id+'\', this.value)" onblur="A.chiudiEditProd()">' : '')
      +((p.storico||[]).length ? '<details><summary>'+ico("storia",10)+' Ultimi ordini · '+p.storico.length+'</summary>'
        +p.storico.map(v=>'<div class="storico-voce">'+fmtData(v.data)+' · '+esc(struttura(v.strutturaId)?.nome||"")+' · '+esc(reparto(v.repartoId)?.nome||"")+' · '+esc(fornitore(v.fornitoreId)?.nome||"")+' · '+v.quantita+' '+esc(v.unita)+'</div>').join("")
        +'</details>' : '')
      +'</div><div class="mini-azioni">'
      +'<button title="Preferito" onclick="A.togglePrefProd(\''+p.id+'\')">'+stella(!!p.preferito,15)+'</button>'
      +'<button title="Modifica nota" onclick="A.toggleEditProd(\''+p.id+'\')">'+ico("matita",14)+'</button>'
      +'<button title="Elimina" onclick="A.eliminaProdotto(\''+p.id+'\')">'+ico("cestino",14)+'</button>'
      +'</div></div></div>';
  });
  return h;
}

/* ---------- Layout ---------- */
function render(){
  const app = document.getElementById("app");
  if(st.caricamento){
    app.innerHTML = '<div class="schermo-carico"><span class="spin">'+ico("giro",18)+'</span> Carico gli ordini</div>';
    return;
  }
  /* salvo il focus */
  const attivo = document.activeElement;
  const fid = attivo && attivo.dataset ? attivo.dataset.fid : null;
  const selPos = (attivo && typeof attivo.selectionStart==="number") ? attivo.selectionStart : null;

  let corpo = "";
  if(st.vista.name==="ordini") corpo = vOrdini();
  else if(st.vista.name==="nuovo") corpo = vNuovo();
  else if(st.vista.name==="dettaglio") corpo = vDettaglio();
  else if(st.vista.name==="catalogo") corpo = vCatalogo();

  const tab = (nome, icona, etichetta, fab) => {
    const on = st.vista.name===nome || (nome==="ordini" && st.vista.name==="dettaglio");
    if(fab) return '<button class="tab fabtab" onclick="A.vai(\''+nome+'\')"><span class="fab">'+ico(icona,22)+'</span><span>'+etichetta+'</span></button>';
    return '<button class="tab'+(on?' on':'')+'" onclick="A.vai(\''+nome+'\')">'+ico(icona,19)+'<span>'+etichetta+'</span></button>';
  };

  app.innerHTML =
    '<header class="topbar"><div class="topbar-in">'
    +'<div class="marchio-riga"><div class="marchio"><small>Alpstay / Gestione forniture</small><b>Ordini giornalieri</b></div>'
    +(st.erroreSalvataggio
      ? '<span class="badge-err">Salvataggio non riuscito</span>'
      : '<span class="salvato'+(st.ultimoSalvataggio?'':' hidden')+'" id="salvato-ind">'+(st.ultimoSalvataggio?'<i></i>Salvato alle '+st.ultimoSalvataggio:'')+'</span>')
    +'</div></div></header>'
    +'<main>'+corpo
    +'<footer class="piepagina">&copy; MP-ALPSTAY 08/2026</footer>'
    +'</main>'
    +'<nav class="bottomnav"><div class="bottomnav-in">'
    +tab("ordini","lista","Ordini")
    +tab("nuovo","piu","Nuovo",true)
    +tab("catalogo","pacco","Catalogo")
    +'</div></nav>';

  /* ripristino il focus */
  const daFocalizzare = st.focusFid || fid;
  if(daFocalizzare){
    const el = document.querySelector('[data-fid="'+daFocalizzare+'"]');
    if(el){
      el.focus();
      if(!st.focusFid && selPos!==null && el.setSelectionRange){ try{ el.setSelectionRange(selPos, selPos); }catch(e){} }
    }
    st.focusFid = null;
  }
}

/* ---------- Lettura bolla via AI ---------- */
function leggiBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.onerror = () => rej({ msg:"Lettura del file non riuscita." });
    r.readAsDataURL(file);
  });
}

/* le foto grandi vengono ridotte e compresse prima dell'invio:
   evita gli errori per dimensione e velocizza la lettura */
async function comprimiImmagine(file){
  if(file.size < 1.5*1024*1024) return { b64: await leggiBase64(file), media: file.type || "image/jpeg" };
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej({ msg:"Immagine non valida o danneggiata." });
      i.src = url;
    });
    const max = 2000;
    const sc = Math.min(1, max/Math.max(img.width, img.height));
    const w = Math.round(img.width*sc), h = Math.round(img.height*sc);
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    c.getContext("2d").drawImage(img, 0, 0, w, h);
    return { b64: c.toDataURL("image/jpeg", 0.85).split(",")[1], media: "image/jpeg" };
  } finally { URL.revokeObjectURL(url); }
}

/* estrazione robusta del JSON: tollera testo attorno e risposte troncate,
   riparando l'elenco all'ultimo prodotto completo */
function estraiJSON(testo){
  let s = testo.replace(/```json|```/g, "").trim();
  const i = s.indexOf("{");
  if(i < 0) throw { msg:"La lettura non ha prodotto un elenco valido. Riprova con una foto più nitida o un PDF." };
  s = s.slice(i);
  try{ return JSON.parse(s.slice(0, s.lastIndexOf("}")+1)); }catch(e){ /* provo a riparare */ }
  let base = s;
  for(let tent = 0; tent < 4; tent++){
    const u = base.lastIndexOf("}");
    if(u < 0) break;
    let cand = base.slice(0, u+1).replace(/,\s*$/, "");
    const aQ = (cand.match(/\[/g)||[]).length, cQ = (cand.match(/\]/g)||[]).length;
    const aG = (cand.match(/\{/g)||[]).length, cG = (cand.match(/\}/g)||[]).length;
    cand += "]".repeat(Math.max(0, aQ-cQ)) + "}".repeat(Math.max(0, aG-cG));
    try{ return JSON.parse(cand); }catch(e){ base = base.slice(0, u); }
  }
  throw { msg:"L'elenco letto era incompleto e non sono riuscito a ricostruirlo. Riprova, se serve dividendo la bolla in due." };
}

async function leggiBolla(file){
  st.bolla = { fase:"caricamento", items:[], fornitoreId:"", errore:"" };
  render();
  try{
    let blocco;
    if(file.type === "application/pdf"){
      if(file.size > 30*1024*1024) throw { msg:"Il PDF supera i 30 MB: riducilo o dividilo in più file." };
      blocco = { type:"document", source:{ type:"base64", media_type:"application/pdf", data: await leggiBase64(file) } };
    } else {
      const img = await comprimiImmagine(file);
      blocco = { type:"image", source:{ type:"base64", media_type: img.media, data: img.b64 } };
    }
    const prompt = 'Questa è una bolla d\'acquisto / documento di consegna di un hotel (gastronomia e hôtellerie).\n'
      +'Estrai l\'elenco dei prodotti. Ignora prezzi, codici articolo, IVA e totali. Ignora testo scritto a mano.\n'
      +'Se i prodotti sono più di 60, elenca solo i primi 60.\n'
      +'Rispondi SOLO con JSON valido e COMPATTO (una sola riga, senza spazi superflui), senza testo prima o dopo e senza backtick, in questo formato:\n'
      +'{"fornitore":"nome fornitore se leggibile, altrimenti null","prodotti":[{"nome":"NOME PRODOTTO IN MAIUSCOLO","categoria":"una tra: '+CATEGORIE.join(", ")+'"}]}';
    if(!PROXY_LETTURA_BOLLE) throw { msg:"La lettura automatica delle bolle non e' configurata su questa installazione: manca l'URL del proxy (vedi README-pubblicazione, sezione Lettura bolle). Puoi comunque inserire i prodotti a mano dal catalogo." };
    let risposta;
    try{
      risposta = await fetch(PROXY_LETTURA_BOLLE,{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:1000,
          messages:[{ role:"user", content:[blocco, {type:"text", text:prompt}] }],
        }),
      });
    }catch(eRete){
      throw { msg:"Connessione al proxy di lettura non riuscita: controlla che l'URL configurato sia giusto e che il Worker sia attivo.", det:String(eRete && eRete.message || eRete) };
    }
    let data;
    try{ data = await risposta.json(); }
    catch(eJson){
      throw { msg:"Il servizio di lettura ha restituito una risposta non valida (stato "+risposta.status+"). Riprova tra qualche istante.", det:String(eJson && eJson.message || eJson) };
    }
    if(data.error) throw { msg:"Il servizio di lettura ha risposto con un errore. Riprova tra qualche istante.", det:String(data.error.message||data.error.type||"sconosciuto") };
    const testo = (data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("\n");
    if(!testo.trim()) throw { msg:"Il documento non è stato letto: riprova con una foto più nitida o un PDF." };
    const json = estraiJSON(testo);
    const esistenti = new Set(st.catalogo.map(p=>norm(p.nome)));
    const visti = new Set();
    const items = (json.prodotti||[]).map(p=>({
      nome: norm(p.nome),
      categoria: CATEGORIE.includes(p.categoria)?p.categoria:"Altro",
      selezionato: !esistenti.has(norm(p.nome)),
      esiste: esistenti.has(norm(p.nome)),
    })).filter(i=>{
      if(!i.nome || visti.has(i.nome)) return false;
      visti.add(i.nome); return true;
    });
    if(!items.length) throw { msg:"Nessun prodotto riconosciuto nel documento: controlla che sia una bolla e che il testo sia leggibile." };
    const fornSugg = json.fornitore ? (st.config.fornitori.find(f=>norm(f.nome)===norm(String(json.fornitore)))?.id||"") : "";
    st.bolla = { fase:"revisione", items, fornitoreId:fornSugg, errore:"" };
  }catch(e){
    st.bolla = { fase:"idle", items:[], fornitoreId:"",
      errore:(e && e.msg) ? e.msg : "Non sono riuscito a leggere la bolla. Riprova con una foto più nitida o un PDF.",
      dettaglio:(e && (e.det || e.message)) ? String(e.det || e.message) : "" };
  }
  render();
}

/* ---------- Avvio ---------- */
function schermataConfig(problema){
  const corpo = problema
    ? '<div class="eyebrow" style="margin-bottom:4px">Database non raggiungibile</div>'
      +'<h2 style="font-size:20px;margin-bottom:10px">Controlla la configurazione</h2>'
      +'<p style="font-size:13px;color:var(--testo);margin-bottom:10px">L\'app si avvia ma non riesce a leggere il database Firebase. Le cause tipiche sono due:</p>'
      +'<p style="font-size:13px;color:var(--testo);margin-bottom:6px"><b>1. databaseURL sbagliata.</b> Apri Firebase &rarr; Realtime Database e copia l\'indirizzo mostrato in alto nella pagina; deve coincidere con la riga databaseURL dentro index.html.</p>'
      +'<p style="font-size:13px;color:var(--testo);margin-bottom:10px"><b>2. Regole non pubblicate.</b> Nella scheda Regole del database incolla le regole indicate nel README (ramo alpstay-ordini in lettura e scrittura) e premi Pubblica.</p>'
      +'<div class="err-box">'+esc(problema)+'</div>'
      +'<button class="btn btn-dark" onclick="location.reload()">Riprova</button>'
    : '<div class="eyebrow" style="margin-bottom:4px">Configurazione richiesta</div>'
      +'<h2 style="font-size:20px;margin-bottom:10px">Collega Firebase</h2>'
      +'<p style="font-size:13px;color:var(--testo);margin-bottom:10px">Questa copia non e\' ancora collegata al database. Apri il file <b>index.html</b> e incolla i dati del tuo progetto Firebase nel blocco <b>FIREBASE_CONFIG</b> in cima allo script, poi ricarica la pagina.</p>'
      +'<p style="font-size:12px;color:var(--grigio)">I passaggi completi sono nel file README-pubblicazione incluso.</p>';
  document.getElementById("app").innerHTML =
    '<header class="topbar"><div class="topbar-in"><div class="marchio-riga"><div class="marchio"><small>Alpstay / Gestione forniture</small><b>Ordini giornalieri</b></div></div></div></header>'
    +'<main><div class="card" style="padding:20px;margin-top:8px">'+corpo
    +'</div><footer class="piepagina">&copy; MP-ALPSTAY 08/2026</footer></main>';
}

/* verifica rapida che il database risponda (URL giusto e regole pubblicate) */
async function provaConnessione(){
  try{
    await Promise.race([
      rtdb.ref(RADICE).once("value"),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error("Nessuna risposta dal database entro 8 secondi (probabile databaseURL errata).")), 8000))
    ]);
    return "";
  }catch(e){ return String(e && e.message || e); }
}

(async function avvio(){
  /* evito che il browser apra i file trascinati fuori dalla zona di rilascio */
  ["dragover","drop"].forEach(t=>document.addEventListener(t, e=>e.preventDefault(), false));
  if(!avviaFirebase()){ schermataConfig(); return; }
  render();
  const problema = await provaConnessione();
  if(problema){ schermataConfig(problema); return; }
  st.config   = await caricaChiave(K_CONFIG,   { strutture:[], reparti:seedReparti, fornitori:seedFornitori });
  st.catalogo = await caricaChiave(K_CATALOGO, seedCatalogo);
  st.ordini   = await caricaChiave(K_ORDINI,   []);
  st.caricamento = false;
  render();
})();
</script>
