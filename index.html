function vStatistiche(){
  const per = st.statPeriodo;
  let da = null, aFine = null;
  if(st.statDa){ const d0 = new Date(st.statDa+"T00:00:00"); if(!isNaN(d0)) da = d0; }
  if(st.statA){ const d1 = new Date(st.statA+"T23:59:59"); if(!isNaN(d1)) aFine = d1; }
  const usaDate = !!(st.statDa || st.statA);
  if(!da && !usaDate && per!=="tutto") da = new Date(Date.now() - Number(per)*86400000);
  const fS = st.statFStruttura, fF = st.statFFornitore, fR = st.statFReparto, fO = st.statFOperatore;

  const oo = st.ordini.filter(o=>{
    const d = new Date(o.data);
    if(da && d < da) return false;
    if(aFine && d > aFine) return false;
    if(fS && o.strutturaId!==fS) return false;
    if(fR && o.repartoId!==fR) return false;
    if(fO && (o.creatoDa||"")!==fO) return false;
    /* filtro fornitore: escludo gli ordini di ALTRI fornitori;
       gli ordini "tutti i fornitori" passano e si filtrano riga per riga */
    if(fF && o.fornitoreId && o.fornitoreId!==fF) return false;
    return true;
  });
  const conf = oo.filter(o=>o.stato==="confermato").length;

  /* righe analitiche: solo prodotti segnati come ordinati, valorizzate in euro */
  const righeSet = [];
  oo.forEach(o=>o.righe.forEach(r=>{
    if(!r.ordinato) return;
    const fidRiga = o.fornitoreId || fornDiRiga(r) || "";
    if(fF && fidRiga!==fF) return;
    const p = r.prodottoId ? st.catalogo.find(x=>x.id===r.prodottoId) : null;
    const prezzo = (p && p.ultimoPrezzo!=null) ? p.ultimoPrezzo : null;
    const qta = Number(r.quantita)||0;
    righeSet.push({ o, r, fid:fidRiga, categoria:(p?.categoria)||"Altro",
      prezzo, valore: prezzo!=null ? prezzo*qta : 0, conPrezzo: prezzo!=null });
  }));
  const righeOrd = righeSet.length;
  const righeConPrezzo = righeSet.filter(x=>x.conPrezzo).length;
  const spesaTot = righeSet.reduce((s,x)=>s+x.valore, 0);
  const ordiniConRighe = new Set(righeSet.map(x=>x.o.id)).size;
  const mediaOrdine = ordiniConRighe ? spesaTot/ordiniConRighe : 0;

  const aggEuro = (fn) => {
    const m = new Map();
    righeSet.forEach(x=>{
      const k = fn(x) || "\u2014";
      const g = m.get(k) || { k, eur:0, n:0, qta:0 };
      g.eur += x.valore; g.n++; g.qta += (Number(x.r.quantita)||0);
      m.set(k, g);
    });
    return [...m.values()].sort((a,b)=>b.eur-a.eur);
  };
  const eurStruttura = aggEuro(x=>struttura(x.o.strutturaId)?.nome||"\u2014");
  const eurFornitore = aggEuro(x=>x.fid ? (fornitore(x.fid)?.nome||"Fornitore eliminato") : "Senza fornitore");
  const eurReparto = aggEuro(x=>reparto(x.o.repartoId)?.nome||"\u2014");
  const conOperatori = (st.config.operatori||[]).length || st.ordini.some(o=>o.creatoDa);
  const eurOperatore = conOperatori ? aggEuro(x=>opNome(x.o.creatoDa)||"Senza operatore") : [];
  const eurCategoria = aggEuro(x=>x.categoria);
  const topProdottiEuro = aggEuro(x=>x.r.nome);

  const movimenti = st.catalogo
    .filter(p=>(p.prezzi||[]).length>=2)
    .map(p=>({ nome:p.nome, da:p.prezzi[1].prezzo, a:p.prezzi[0].prezzo }))
    .filter(x=>Math.abs(x.a-x.da)>0.004)
    .sort((x,y)=>Math.abs((y.a-y.da)/y.da) - Math.abs((x.a-x.da)/x.da))
    .slice(0,20);

  /* helper veloci per cataloghi grandi: listino con nomi normalizzati */
  const listino = st.catalogo.filter(p=>p.ultimoPrezzo!=null).map(p=>({ p, N:norm(p.nome) }));
  const simile = (A,B)=>{
    if(A===B) return true;
    const corto = A.length<=B.length?A:B, lungo = A.length<=B.length?B:A;
    const parole = corto.split(" ").filter(w=>w.length>2);
    if(!parole.length) return false;
    return parole.every(w=>lungo.includes(w));
  };
  const migliorAlt = (p)=>{
    const N = norm(p.nome); let alt = null;
    for(const e of listino){
      if(e.p.id===p.id) continue;
      if(e.p.ultimoPrezzo >= p.ultimoPrezzo - 0.004) continue;
      if(alt && e.p.ultimoPrezzo >= alt.ultimoPrezzo) continue;
      if(!simile(N, e.N)) continue;
      alt = e.p;
    }
    return alt;
  };

  /* allarme risparmio: prodotti molto consumati con prezzi pesanti */
  const consumo = new Map();
  righeSet.forEach(x=>{
    const k = x.r.prodottoId || norm(x.r.nome);
    const v = consumo.get(k) || { nome:x.r.nome, qty:0, pid:x.r.prodottoId||null };
    v.qty += (Number(x.r.quantita)||1);
    consumo.set(k, v);
  });
  const allarmi = [];
  consumo.forEach(v=>{
    const p = v.pid ? st.catalogo.find(x=>x.id===v.pid) : st.catalogo.find(x=>norm(x.nome)===norm(v.nome));
    if(!p || p.ultimoPrezzo==null) return;
    let alt = null;
    st.catalogo.forEach(q=>{
      if(q.id===p.id || q.ultimoPrezzo==null) return;
      if(!nomiSimili(p.nome, q.nome)) return;
      if(q.ultimoPrezzo < p.ultimoPrezzo - 0.004 && (!alt || q.ultimoPrezzo < alt.ultimoPrezzo)) alt = q;
    });
    let rincaro = null;
    if((p.prezzi||[]).length>=2 && p.prezzi[0].prezzo > p.prezzi[1].prezzo + 0.004){
      rincaro = { da:p.prezzi[1].prezzo, a:p.prezzi[0].prezzo };
    }
    allarmi.push({ nome:p.nome, qty:v.qty, prezzo:p.ultimoPrezzo, spesa:v.qty*p.ultimoPrezzo,
      forn:fornitore(p.ultimoFornitoreId)?.nome||"", alt, rincaro });
  });
  allarmi.sort((a,b)=>b.spesa-a.spesa);
  const topAllarmi = allarmi.slice(0,8);
  const risparmioPot = topAllarmi.reduce((s,a)=> s + (a.alt ? (a.prezzo - a.alt.ultimoPrezzo)*a.qty : 0), 0);
  /* base alternativa: frequenza delle consegne dalle bolle x ultimo prezzo */
  let baseProxy = false, lista = topAllarmi, risparmio = risparmioPot;
  if(!lista.length){
    baseProxy = true;
    const a2l = [];
    listino.forEach(e=>{
      const p = e.p;
      const freq = (p.prezzi||[]).filter(v=>!da || new Date(v.data)>=da).length;
      if(!freq) return;
      const alt = migliorAlt(p);
      let rincaro = null;
      if((p.prezzi||[]).length>=2 && p.prezzi[0].prezzo > p.prezzi[1].prezzo + 0.004) rincaro = { da:p.prezzi[1].prezzo, a:p.prezzi[0].prezzo };
      a2l.push({ nome:p.nome, qty:freq, prezzo:p.ultimoPrezzo, spesa:freq*p.ultimoPrezzo,
        forn:fornitore(p.ultimoFornitoreId)?.nome||"", alt, rincaro });
    });
    a2l.sort((x,y)=>y.spesa-x.spesa);
    lista = a2l.slice(0,8);
    risparmio = lista.reduce((s,a3)=> s + (a3.alt ? (a3.prezzo - a3.alt.ultimoPrezzo)*a3.qty : 0), 0);
  }

  const barre = (titolo, coppie) => {
    if(!coppie.length) return "";
    const mx = coppie[0][1] || 1;
    let x = '<div class="card" style="padding:12px;margin-bottom:12px">'+sezTit(titolo);
    coppie.slice(0,8).forEach(cp=>{
      x += '<div class="stat-riga"><div class="stat-etic"><span>'+esc(cp[0])+'</span><b>'+cp[1]+'</b></div>'
        +'<div class="stat-traccia"><i style="width:'+Math.round(cp[1]/mx*100)+'%"></i></div></div>';
    });
    return x+'</div>';
  };
  const barreEuro = (titolo, agg) => {
    if(!agg.length) return "";
    const mx = agg[0].eur || 1;
    let x = '<div class="card" style="padding:12px;margin-bottom:12px">'+sezTit(titolo);
    agg.slice(0,10).forEach(g=>{
      x += '<div class="stat-riga"><div class="stat-etic"><span>'+esc(g.k)+'</span><b>'+fmtEuro(g.eur)+'</b></div>'
        +'<div class="risp-sub" style="margin:0 0 3px">'+g.n+' righe \u00b7 q.t\u00e0 '+Math.round(g.qta*100)/100+'</div>'
        +'<div class="stat-traccia"><i style="width:'+Math.round(g.eur/mx*100)+'%"></i></div></div>';
    });
    if(agg.length>10) x += '<div class="risp-sub">\u2026 e altre '+(agg.length-10)+' voci</div>';
    return x+'</div>';
  };

  let h = '<button class="indietro-link" onclick="A.vai(\'ordini\')">'+ico("frecciaS",14)+' Ordini</button>';
  h += '<div class="step-testa"><div><div class="eyebrow">Analisi</div><h2>Statistiche</h2></div></div>';
  const attivoChip = usaDate ? "" : per;
  h += '<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">'
    +[["30","30 giorni"],["90","90 giorni"],["365","12 mesi"],["tutto","Tutto"]].map(c=>'<button class="btn-mini'+(attivoChip===c[0]?' on':'')+'" onclick="A.setStatPeriodo(\''+c[0]+'\')">'+c[1]+'</button>').join("")+'</div>';
  h += '<div class="stat-filtri">'
    +'<label>Dal <input type="date" value="'+esc(st.statDa)+'" onchange="A.setStatData(\'statDa\', this.value)"></label>'
    +'<label>Al <input type="date" value="'+esc(st.statA)+'" onchange="A.setStatData(\'statA\', this.value)"></label>'
    +'</div>';
  h += '<div class="stat-filtri">'
    +'<select onchange="A.setStatFiltro(\'statFStruttura\', this.value)"><option value="">Tutte le strutture</option>'+st.config.strutture.map(s=>'<option value="'+s.id+'"'+(fS===s.id?' selected':'')+'>'+esc(s.nome)+'</option>').join("")+'</select>'
    +'<select onchange="A.setStatFiltro(\'statFFornitore\', this.value)"><option value="">Tutti i fornitori</option>'+st.config.fornitori.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(f=>'<option value="'+f.id+'"'+(fF===f.id?' selected':'')+'>'+esc(f.nome)+'</option>').join("")+'</select>'
    +'<select onchange="A.setStatFiltro(\'statFReparto\', this.value)"><option value="">Tutti i reparti</option>'+st.config.reparti.map(r=>'<option value="'+r.id+'"'+(fR===r.id?' selected':'')+'>'+esc(r.nome)+'</option>').join("")+'</select>'
    +(conOperatori?'<select onchange="A.setStatFiltro(\'statFOperatore\', this.value)"><option value="">Tutti gli operatori</option>'+(st.config.operatori||[]).map(op=>'<option value="'+op.id+'"'+(fO===op.id?' selected':'')+'>'+esc(op.nome)+'</option>').join("")+'</select>':'')
    +((fS||fF||fR||fO||usaDate)?'<button class="btn-mini" onclick="A.azzeraStatFiltri()">Azzera filtri</button>':'')
    +'</div>';
  h += '<p class="suggerimento" style="margin:0 0 10px">Periodo: '+(da?fmtData(da.toISOString()):"inizio")+' \u2192 '+(aFine?fmtData(aFine.toISOString()):"oggi")
    +' \u00b7 importi stimati sugli ultimi prezzi noti \u00b7 prezzo disponibile su '+righeConPrezzo+' righe su '+righeOrd+'.</p>';
  h += '<div class="kpi">'
    +'<div class="card"><b style="font-size:22px">'+fmtEuro(spesaTot)+'</b><span>Spesa stimata</span></div>'
    +'<div class="card"><b>'+oo.length+'</b><span>Ordini \u00b7 '+conf+' conf.</span></div>'
    +'<div class="card"><b>'+righeOrd+'</b><span>Righe ordinate</span></div>'
    +'<div class="card"><b style="font-size:22px">'+fmtEuro(mediaOrdine)+'</b><span>Media per ordine</span></div>'
    +'</div>';
  if(!oo.length) h += '<div class="vuoto mb12">Nessun ordine nel periodo scelto.</div>';
  if(lista.length){
    let x = '<div class="card" style="padding:12px;margin-bottom:12px;border-color:var(--verde)">'+sezTit("Allarme risparmio \u00b7 dove incidere");
    x += '<p class="suggerimento" style="margin:0 0 10px">I prodotti pi\u00f9 consumati nel periodo con la spesa pi\u00f9 pesante: qui un ritocco di prezzo vale di pi\u00f9.</p>'+(baseProxy?'<p class="suggerimento" style="margin:-4px 0 10px">Base di calcolo: frequenza delle consegne dalle bolle \u00d7 ultimo prezzo (nessun ordine app nel periodo).</p>':'');
    if(risparmio > 0.004){
      x += '<div class="risp-tot">Risparmio potenziale stimato: <b>'+fmtEuro(risparmio)+'</b> nel periodo, passando alle alternative pi\u00f9 economiche gi\u00e0 a catalogo.</div>';
    }
    lista.forEach(a2=>{
      x += '<div class="risp-riga"><div class="stat-etic"><span>'+esc(a2.nome)+(a2.forn?' \u00b7 '+esc(a2.forn):'')+'</span><b>'+fmtEuro(a2.spesa)+'</b></div>'
        +'<div class="risp-sub">'+a2.qty+(baseProxy?' consegne rilevate':' ordinati')+' \u00d7 '+fmtEuro(a2.prezzo)+'</div>';
      if(a2.rincaro) x += '<div class="risp-sub var-su">\u25b2 Rincaro recente: '+fmtEuro(a2.rincaro.da)+' \u2192 '+fmtEuro(a2.rincaro.a)+' ('+pctVar(a2.rincaro.da,a2.rincaro.a)+') \u2014 da rinegoziare</div>';
      if(a2.alt) x += '<div class="risp-sub var-giu">\u25bc Alternativa: '+esc(a2.alt.nome)+' a '+fmtEuro(a2.alt.ultimoPrezzo)
        +(fornitore(a2.alt.ultimoFornitoreId)?.nome ? ' da '+esc(fornitore(a2.alt.ultimoFornitoreId).nome) : '')
        +' ('+pctVar(a2.prezzo, a2.alt.ultimoPrezzo)+')</div>';
      x += '</div>';
    });
    h += x + '</div>';
  }

  /* andamento costi: variazione media mensile dei prezzi rilevati */
  const mesiMap = new Map();
  st.catalogo.forEach(p=>{
    const arr = p.prezzi||[];
    for(let i2=0; i2<arr.length-1; i2++){
      const v = arr[i2], prev = arr[i2+1];
      if(!v || !prev || v.prezzo==null || prev.prezzo==null || prev.prezzo<=0 || !v.data) continue;
      const pcv = (v.prezzo-prev.prezzo)/prev.prezzo*100;
      if(!isFinite(pcv)) continue;
      const chiave = String(v.data).slice(0,7);
      const mm = mesiMap.get(chiave)||{ s:0, n:0 };
      mm.s += pcv; mm.n++;
      mesiMap.set(chiave, mm);
    }
  });
  const andamento = [...mesiMap.entries()].sort((x,y)=>x[0].localeCompare(y[0])).slice(-8)
    .map(e=>({ mese:e[0].slice(5,7)+"/"+e[0].slice(2,4), media:e[1].s/e[1].n, n:e[1].n }));
  if(andamento.length){
    let x = '<div class="card" style="padding:12px;margin-bottom:12px">'+sezTit("Andamento costi \u00b7 indice del listino");
    x += '<p class="suggerimento" style="margin:0 0 10px">Variazione media dei prezzi rilevati, mese per mese (da bolle e conferme).</p>';
    andamento.forEach(m=>{
      const su = m.media > 0.05, giu = m.media < -0.05;
      const largh = Math.min(100, Math.round(Math.abs(m.media)/25*100));
      x += '<div class="stat-riga"><div class="stat-etic"><span>'+m.mese+' \u00b7 '+m.n+' rilevazioni</span>'
        +'<b class="'+(su?'var-su':(giu?'var-giu':''))+'">'+(su?'\u25b2 ':'')+(giu?'\u25bc ':'')+(m.media>0?'+':'')+m.media.toFixed(1).replace(".",",")+'%</b></div>'
        +'<div class="stat-traccia"><i style="width:'+largh+'%'+(su?';background:var(--rosso)':'')+'"></i></div></div>';
    });
    h += x + '</div>';
  }

  /* possibili sprechi: alternative simili molto piu' economiche a catalogo */
  const sprechi = [];
  listino.forEach(e=>{
    const p = e.p;
    const alt = migliorAlt(p);
    if(!alt) return;
    const gap = (p.ultimoPrezzo-alt.ultimoPrezzo)/p.ultimoPrezzo*100;
    if(gap < 15) return;
    sprechi.push({ p, alt, gap });
  });
  sprechi.sort((x,y)=>y.gap-x.gap);
  if(sprechi.length){
    let x = '<div class="card" style="padding:12px;margin-bottom:12px">'+sezTit("Possibili sprechi \u00b7 "+Math.min(10,sprechi.length));
    x += '<p class="suggerimento" style="margin:0 0 10px">Prodotti con un articolo simile pi\u00f9 economico gi\u00e0 a catalogo. Oltre il 60% di differenza, verifica prima unit\u00e0 o confezione.</p>';
    sprechi.slice(0,10).forEach(s2=>{
      x += '<div class="risp-riga"><div class="stat-etic"><span>'+esc(s2.p.nome)+(fornitore(s2.p.ultimoFornitoreId)?.nome?' \u00b7 '+esc(fornitore(s2.p.ultimoFornitoreId).nome):'')+'</span><b>'+fmtEuro(s2.p.ultimoPrezzo)+'</b></div>'
        +'<div class="risp-sub var-giu">\u25bc '+esc(s2.alt.nome)+' a '+fmtEuro(s2.alt.ultimoPrezzo)
        +(fornitore(s2.alt.ultimoFornitoreId)?.nome?' da '+esc(fornitore(s2.alt.ultimoFornitoreId).nome):'')
        +' (\u2212'+s2.gap.toFixed(0)+'%)</div>'
        +(s2.gap>60?'<div class="risp-sub var-su">\u25b2 Differenza molto alta: probabile unit\u00e0 o confezione diversa \u2014 verifica</div>':'')
        +'</div>';
    });
    h += x + '</div>';
  }
  h += barreEuro("Spesa per fornitore", eurFornitore);
  h += barreEuro("Spesa per struttura", eurStruttura);
  h += barreEuro("Spesa per reparto", eurReparto);
  h += barreEuro("Spesa per categoria", eurCategoria);
  if(eurOperatore.length) h += barreEuro("Spesa per operatore", eurOperatore);
  h += barreEuro("Top prodotti per spesa", topProdottiEuro);
  if(movimenti.length){
    let x = '<div class="card" style="padding:12px;margin-bottom:12px">'+sezTit("Ultime variazioni di prezzo \u00b7 "+movimenti.length);
    movimenti.forEach(v=>{
      const su = v.a>v.da;
      x += '<div class="storico-voce">'+esc(v.nome)+': '+fmtEuro(v.da)+' \u2192 <b class="'+(su?'var-su':'var-giu')+'">'+fmtEuro(v.a)+' '+(su?'\u25b2':'\u25bc')+' '+pctVar(v.da,v.a)+'</b></div>';
    });
    h += x+'</div>';
  }
  return h;
}

/* ---------- Calendario forniture ---------- */
function scadenzeOggi(){
  const oggi = new Date(); const wd = (oggi.getDay()+6)%7;
  const out = [];
  (st.config?.fornitori||[]).forEach(f=>(f.consegne||[]).forEach(c=>{
    const dl = ((c.giorno-(c.anticipo||0))%7+7)%7;
    if(dl!==wd) return;
    out.push({ f, c, entro: c.entroOra||"12:00" });
  }));
  out.sort((a,b)=>a.entro.localeCompare(b.entro));
  return out;
}
function minutiA(hhmm){
  const p = String(hhmm).split(":");
  const ora = new Date();
  return (Number(p[0])*60+(Number(p[1])||0)) - (ora.getHours()*60+ora.getMinutes());
}
function bannerScadenze(){
  if(st.avvisoScadChiuso) return "";
  const sc = scadenzeOggi().filter(s=>minutiA(s.entro) > -60);
  if(!sc.length) return "";
  let h = '<div class="card avviso-scad">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
    +'<span class="eyebrow" style="color:var(--rosso)">Scadenze ordine di oggi</span>'
    +'<button style="color:var(--grigio);padding:2px" onclick="A.chiudiAvvisoScad()">'+ico("x",14)+'</button></div>';
  sc.forEach(s=>{
    const m = minutiA(s.entro);
    h += '<div class="cal-voce" style="border-top:none;padding:4px 0">'
      +'<span class="cal-tag '+(m<=90?'scad':'cons')+'">Entro '+esc(s.entro)+'</span>'
      +'<span><b>'+esc(s.f.nome)+'</b>'+(m<0?' \u00b7 termine passato':(m<=120?' \u00b7 tra '+m+' min':''))+'</span>'
      +'<button class="btn-mini cal-ordina" onclick="A.nuovoOrdineForn(\''+s.f.id+'\')">Ordina</button></div>';
  });
  return h+'</div>';
}

function vCalendario(){
  let h = '<button class="indietro-link" onclick="A.vai(\'ordini\')">'+ico("frecciaS",14)+' Ordini</button>';
  h += '<div class="step-testa"><div><div class="eyebrow">Forniture</div><h2>Calendario</h2></div></div>';
  const conCal = st.config.fornitori.filter(f=>(f.consegne||[]).length);
  if(!conCal.length){
    h += '<div class="vuoto">Nessun giorno di fornitura configurato.<br><br>Vai in <b>Impostazioni \u2192 Fornitori</b> e tocca l\'icona calendario di un fornitore per impostare i giorni di consegna e il termine ultimo d\'ordine.</div>';
    return h;
  }
  const oggi = new Date(); oggi.setHours(0,0,0,0);
  for(let i=0; i<14; i++){
    const d = new Date(oggi.getTime()+i*86400000);
    const wd = (d.getDay()+6)%7;
    const scad = [], cons = [];
    conCal.forEach(f=>(f.consegne||[]).forEach(c=>{
      if(c.giorno===wd) cons.push({ f, c });
      const dl = ((c.giorno-(c.anticipo||0))%7+7)%7;
      if(dl===wd) scad.push({ f, c });
    }));
    if(!scad.length && !cons.length && i>0) continue;
    const nomeG = GIORNI_SETT[wd]+' '+d.getDate()+'/'+String(d.getMonth()+1).padStart(2,"0");
    h += '<div class="card'+(i===0?' cal-oggi':'')+'" style="padding:12px;margin-bottom:10px">'
      +'<div class="cal-testa"><span>'+nomeG+'</span>'
      +(i===0?'<span class="chip-oggi">Oggi</span>':(i===1?'<span class="chip-oggi" style="background:var(--grigio-verde)">Domani</span>':''))
      +'</div>';
    scad.sort((x,y)=>(x.c.entroOra||"").localeCompare(y.c.entroOra||""));
    scad.forEach(x=>{
      h += '<div class="cal-voce"><span class="cal-tag scad">Entro '+esc(x.c.entroOra||"12:00")+'</span>'
        +'<span>Ordine <b>'+esc(x.f.nome)+'</b> \u00b7 consegna '+GIORNI_BREVI[x.c.giorno].toLowerCase()+'</span>'
        +'<button class="btn-mini cal-ordina" onclick="A.nuovoOrdineForn(\''+x.f.id+'\')">Ordina</button></div>';
    });
    cons.forEach(x=>{
      h += '<div class="cal-voce"><span class="cal-tag cons">Consegna</span><span><b>'+esc(x.f.nome)+'</b></span></div>';
    });
    h += '</div>';
  }
  h += '<p class="suggerimento">Giorni e termini si impostano in Impostazioni \u2192 Fornitori, con l\'icona calendario.</p>';
  return h;
}

/* ---------- Stampa ordine ---------- */
function foglioStampa(o, fid, righe, multi){
  const s = struttura(o.strutturaId), r = reparto(o.repartoId);
  const fNome = multi
    ? (fid ? (fornitore(fid)?.nome||"Fornitore eliminato") : "Senza fornitore")
    : (fornitore(o.fornitoreId)?.nome||"Tutti i fornitori");
  const rigaStampa = (rg)=>{
    const p = st.catalogo.find(x=>x.id===rg.prodottoId);
    const prezzo = (p && p.ultimoPrezzo!=null) ? fmtEuro(p.ultimoPrezzo) : "\u2014";
    return '<tr><td>'+esc(rg.nome)+'</td><td>'+rg.quantita+'</td><td>'+esc(rg.unita)+'</td><td>'+prezzo+'</td><td>'+esc(rg.nota||"")+'</td>'
      +'<td>'+(rg.ordinato ? '\u2713 '+fmtOra(rg.ordinatoAt) : '\u2014')+'</td></tr>';
  };
  let ctrl = "";
  if(!multi && o.controllo){
    const c = o.controllo;
    ctrl = '<div class="st-ctrl"><b>Controllo consegna del '+fmtData(c.data)+':</b> '
      +((c.mancanti||[]).length || (c.extra||[]).length
        ? ((c.mancanti||[]).length ? 'non consegnati: '+c.mancanti.map(x=>esc(x.nome)).join(", ")+'. ' : '')
          +((c.extra||[]).length ? 'In bolla ma non ordinati: '+c.extra.map(x=>esc(x.nome)).join(", ")+'.' : '')
        : 'consegna conforme all\'ordine ('+c.conformi+' corrispondenze).')
      +'</div>';
  }
  return '<div class="st-doc">'
    +'<div class="st-testa"><div><div class="st-eyebrow">Alpstay / Gestione forniture \u00b7 Ordine '+esc(o.numero)+'</div>'
    +'<div class="st-titolo">'+esc(fNome)+'</div></div>'
    +'<div class="st-meta">Creato il '+fmtData(o.data)+' '+fmtOra(o.data)
    +(o.confermatoAt?'<br>Confermato il '+fmtData(o.confermatoAt)+' '+fmtOra(o.confermatoAt):'')+'</div></div>'
    +'<table class="st-info"><tr><td>Struttura</td><td>'+esc(s?.nome||"Struttura eliminata")+'</td><td>Reparto</td><td>'+esc(r?.nome||"\u2014")+'</td></tr>'
    +'<tr><td>Fornitore</td><td>'+esc(fNome)+'</td><td>Stato</td><td>'+(o.stato==="aperto"?"Aperto":(ordineParziale(o)?"Parziale":"Confermato"))+'</td></tr>'
    +((o.creatoDa||o.confermatoDa)?'<tr><td>Elaborato da</td><td>'+esc(opNome(o.creatoDa)||"\u2014")+'</td><td>Confermato da</td><td>'+esc(opNome(o.confermatoDa)||"\u2014")+'</td></tr>':'')
    +'</table>'
    +'<table class="st-tab"><thead><tr><th>Prodotto</th><th>Q.t\u00e0</th><th>UM</th><th>Ultimo prezzo</th><th>Nota</th><th>Ordinato</th></tr></thead><tbody>'
    +righe.map(rigaStampa).join("")+'</tbody></table>'
    +'<div class="st-tot">'+righe.length+' righe \u00b7 '+righe.filter(x=>x.ordinato).length+' ordinate'+(multi?' \u00b7 foglio del fornitore':'')+'</div>'
    +ctrl
    +'<div class="st-firma"><span>Firma operatore</span><span>Firma fornitore / rappresentante</span></div>'
    +'<div class="st-pie">&copy; MP-ALPSTAY 08/2026</div>'
    +'</div>';
}
function stampaHTML(o){
  if(o.fornitoreId) return foglioStampa(o, o.fornitoreId, o.righe, false);
  const gr = new Map();
  o.righe.forEach(rg=>{ const fid = fornDiRiga(rg); if(!gr.has(fid)) gr.set(fid, []); gr.get(fid).push(rg); });
  const chiavi = [...gr.keys()].sort((a,b)=>{
    const na = a ? (fornitore(a)?.nome||"~") : "~~"; const nb = b ? (fornitore(b)?.nome||"~") : "~~";
    return na.localeCompare(nb);
  });
  if(!chiavi.length) return foglioStampa(o, "", o.righe, true);
  return chiavi.map(fid=>foglioStampa(o, fid, gr.get(fid), true)).join("");
}

/* ---------- Invio ordine su WhatsApp ---------- */
function testoOrdineWA(o, fid){
  const s = struttura(o.strutturaId), r = reparto(o.repartoId);
  const righe = (fid===null) ? o.righe : o.righe.filter(rg=>fornDiRiga(rg)===fid);
  const fNome = (fid===null)
    ? (fornitore(o.fornitoreId)?.nome||"")
    : (fid ? (fornitore(fid)?.nome||"") : "");
  let txt = "*ORDINE "+o.numero+"*";
  if(s) txt += " \u2014 "+s.nome;
  if(r) txt += " / "+r.nome;
  txt += "\n"+fmtData(o.data);
  if(fNome) txt += "\nFornitore: "+fNome;
  txt += "\n\n";
  righe.forEach(rg=>{
    txt += "\u2022 "+rg.quantita+" "+rg.unita+" \u2014 "+rg.nome+(rg.nota?" ("+rg.nota+")":"")+"\n";
  });
  txt += "\nTotale: "+righe.length+" articoli";
  return txt;
}
function telWa(f){
  if(!f || !f.telefono) return "";
  let d = String(f.telefono).replace(/\D/g,"");
  if(d.startsWith("00")) d = d.slice(2);
  if(d && !d.startsWith("39") && (d.startsWith("3")||d.startsWith("0")) && d.length<=11) d = "39"+d;
  return d;
}
function linkWa(num, txt){
  const enc = encodeURIComponent(txt);
  const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent||"");
  if(mobile) return "https://wa.me/"+(num||"")+"?text="+enc;
  const canale = st.config?.waCanale || "web";
  if(canale==="app") return "whatsapp://send?"+(num?("phone="+num+"&"):"")+"text="+enc;
  if(num) return "https://web.whatsapp.com/send?phone="+num+"&text="+enc;
  /* senza numero in anagrafica: pagina ponte con la scelta "usa WhatsApp Web" */
  return "https://wa.me/?text="+enc;
}

/* ---------- Layout ---------- */
function render(){

    app.innerHTML = '<div class="schermo-carico"><span class="spin">'+ico("giro",18)+'</span> Carico gli ordini</div>';
    return;
  }
  /* blocco operatore: con PIN configurati serve l'accesso */

    app.innerHTML = vBlocco();
    const elPin = document.querySelector('[data-fid="pin"]'); if(elPin) elPin.focus();
    return;
  }

  /* salvo il focus */
  const attivo = document.activeElement;
  const fid = attivo && attivo.dataset ? attivo.dataset.fid : null;
  const selPos = (attivo && typeof attivo.selectionStart==="number") ? attivo.selectionStart : null;
  const scrollY0 = window.scrollY;

  let corpo = "";
  if(st.vista.name==="ordini") corpo = bannerScadenze() + vOrdini();
  else if(st.vista.name==="nuovo") corpo = vNuovo();
  else if(st.vista.name==="dettaglio") corpo = vDettaglio();
  else if(st.vista.name==="catalogo") corpo = vCatalogo();
  else if(st.vista.name==="impostazioni") corpo = vImpostazioni();
  else if(st.vista.name==="statistiche") corpo = vStatistiche();
  else if(st.vista.name==="calendario") corpo = vCalendario();

  const tab = (nome, icona, etichetta, fab) => {
    const on = st.vista.name===nome || (nome==="ordini" && st.vista.name==="dettaglio");
    if(fab) return '<button class="tab fabtab" onclick="A.vai(\''+nome+'\')"><span class="fab">'+ico(icona,22)+'</span><span>'+etichetta+'</span></button>';
    return '<button class="tab'+(on?' on':'')+'" onclick="A.vai(\''+nome+'\')">'+ico(icona,19)+'<span>'+etichetta+'</span></button>';
  };

  app.innerHTML =
    '<header class="topbar"><div class="topbar-in">'
    +'<div class="marchio-riga"><div class="marchio"><small>Alpstay / Gestione forniture</small><b>Ordini giornalieri</b></div>'
    +'<div style="display:flex;align-items:center;gap:6px">'
    +(st.erroreSalvataggio
      ? '<span class="badge-err">Salvataggio non riuscito</span>'
      : '<span class="salvato'+(st.ultimoSalvataggio?'':' hidden')+'" id="salvato-ind">'+(st.ultimoSalvataggio?'<i></i>Salvato alle '+st.ultimoSalvataggio:'')+'</span>')
    +(st.operatoreId?'<button class="btn-icona" title="Operatore: '+esc(opNome(st.operatoreId))+' (tocca per cambiare)" onclick="A.esciOperatore()"><span class="mono sm">'+esc(mono(opNome(st.operatoreId)))+'</span></button>':'')
    +(function(){ const n = scadenzeOggi().filter(s=>minutiA(s.entro)>=0).length;
      return '<button class="btn-icona" style="position:relative" title="Calendario forniture" onclick="A.vai(\'calendario\')">'+ico("calendario",18)
        +(n?'<span class="badge-punto">'+n+'</span>':'')+'</button>'; })()
    +'<button class="btn-icona" title="Statistiche" onclick="A.vai(\'statistiche\')">'+ico("grafico",18)+'</button>'
    +'<button class="btn-icona" title="Impostazioni" onclick="A.vai(\'impostazioni\')">'+ico("ingranaggio",18)+'</button>'
    +'</div></div></div></header>'
    +'<main>'+corpo
    +'<footer class="piepagina">&copy; MP-ALPSTAY 08/2026</footer>'
    +'</main>'
    +'<nav class="bottomnav"><div class="bottomnav-in">'
    +tab("ordini","lista","Ordini")
    +tab("nuovo","piu","Nuovo",true)
    +tab("catalogo","pacco","Catalogo")
    +'</div></nav>';

  /* ripristino scorrimento e focus (senza far saltare la pagina) */
  window.scrollTo(0, scrollY0);
  const daFocalizzare = st.focusFid || fid;
  if(daFocalizzare){
    const el = document.querySelector('[data-fid="'+daFocalizzare+'"]');
    if(el){
      try{ el.focus({ preventScroll:true }); }catch(e){ el.focus(); }
      if(st.focusFid) { try{ el.scrollIntoView({ block:"center" }); }catch(e){} }
      if(!st.focusFid && selPos!==null && el.setSelectionRange){ try{ el.setSelectionRange(selPos, selPos); }catch(e){} }
    }
    st.focusFid = null;
  }
}

  setRaggruppa(v){ st.raggruppaForn=v; render(); },

  confermaOrdine(oid){
    const o = st.ordini.find(x=>x.id===oid);
    if(!o) return;
    const adesso = new Date().toISOString();
    const fscelto = st.confermaForn || o.fornitoreId || "";
    st.ordini = st.ordini.map(x=>x.id===oid?{...x,stato:"confermato",confermatoAt:adesso,confermatoDa:st.operatoreId||null,fornitoreId:fscelto}:x);
    salvaOrdini();
    /* arricchimento automatico dei prodotti (solo righe ordinate) */
    const righeOk = o.righe.filter(r=>r.ordinato);
    if(righeOk.length){
      st.catalogo = st.catalogo.map(p=>{
        const r = righeOk.find(x=>x.prodottoId===p.id);
        if(!r) return p;
        const voce = { data:adesso, fornitoreId:fscelto||null, strutturaId:o.strutturaId, repartoId:o.repartoId, quantita:r.quantita, unita:r.unita };
        return {...p, ultimoFornitoreId:fscelto||p.ultimoFornitoreId||null, ultimaStrutturaId:o.strutturaId, ultimoRepartoId:o.repartoId, ultimaData:adesso, storico:[voce,...(p.storico||[])].slice(0,10)};

  confermaParziale(oid){
    const o = st.ordini.find(x=>x.id===oid); if(!o) return;
    const ordinate = o.righe.filter(r=>r.ordinato);
    const residue = o.righe.filter(r=>!r.ordinato);
    if(!ordinate.length || !residue.length){ A.confermaOrdine(oid); return; }
    const adesso = new Date().toISOString();
    const fscelto = st.confermaForn || o.fornitoreId || "";
    /* la nuova lista aperta con i prodotti non ancora ordinati */
    const residuo = { id:uid("o"), numero:"ORD-"+String(st.ordini.length+1).padStart(4,"0"), data:adesso,
      strutturaId:o.strutturaId, repartoId:o.repartoId, fornitoreId:o.fornitoreId,
      stato:"aperto", righe:residue, confermatoAt:null,
      creatoDa:st.operatoreId||o.creatoDa||null, derivatoDa:o.numero };

    st.ordini = st.ordini.map(x=>x.id!==oid?x:{...x, righe:ordinate, stato:"confermato", confermatoAt:adesso, confermatoDa:st.operatoreId||null, proseguitoIn:residuo.numero, fornitoreId:fscelto});
    st.ordini = [residuo, ...st.ordini];
    salvaOrdini();
    /* arricchimento dei prodotti come nella conferma normale */
    st.catalogo = st.catalogo.map(p=>{
      const r = ordinate.find(x=>x.prodottoId===p.id);
      if(!r) return p;
      const voce = { data:adesso, fornitoreId:fscelto||null, strutturaId:o.strutturaId, repartoId:o.repartoId, quantita:r.quantita, unita:r.unita };
      return {...p, ultimoFornitoreId:fscelto||p.ultimoFornitoreId||null, ultimaStrutturaId:o.strutturaId, ultimoRepartoId:o.repartoId, ultimaData:adesso, storico:[voce, ...(p.storico||[])].slice(0,10)};

    salvaCatalogo();
    st.confermaVisibile=false; st.confermaForn="";
    st.vista={name:"ordini"}; render();
  },

/* ---------- Lettura bolla via AI ---------- */
function leggiBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.onerror = () => rej({ msg:"Lettura del file non riuscita." });
    r.readAsDataURL(file);
  });
}

/* le foto grandi vengono ridotte e compresse prima dell'invio:
   evita gli errori per dimensione e velocizza la lettura */
async function comprimiImmagine(file){
  if(file.size < 1.5*1024*1024) return { b64: await leggiBase64(file), media: file.type || "image/jpeg" };
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej({ msg:"Immagine non valida o danneggiata." });
      i.src = url;
    });
    const max = 2000;
    const sc = Math.min(1, max/Math.max(img.width, img.height));
    const w = Math.round(img.width*sc), h = Math.round(img.height*sc);
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    c.getContext("2d").drawImage(img, 0, 0, w, h);
    return { b64: c.toDataURL("image/jpeg", 0.85).split(",")[1], media: "image/jpeg" };
  } finally { URL.revokeObjectURL(url); }
}

/* estrazione robusta del JSON: tollera testo attorno e risposte troncate,
   riparando l'elenco all'ultimo prodotto completo */
function estraiJSON(testo){
  let s = testo.replace(/```json|```/g, "").trim();
  const i = s.indexOf("{");
  if(i < 0) throw { msg:"La lettura non ha prodotto un elenco valido. Riprova con una foto più nitida o un PDF." };
  s = s.slice(i);
  try{ return JSON.parse(s.slice(0, s.lastIndexOf("}")+1)); }catch(e){ /* provo a riparare */ }
  let base = s;
  for(let tent = 0; tent < 4; tent++){
    const u = base.lastIndexOf("}");
    if(u < 0) break;
    let cand = base.slice(0, u+1).replace(/,\s*$/, "");
    const aQ = (cand.match(/\[/g)||[]).length, cQ = (cand.match(/\]/g)||[]).length;
    const aG = (cand.match(/\{/g)||[]).length, cG = (cand.match(/\}/g)||[]).length;
    cand += "]".repeat(Math.max(0, aQ-cQ)) + "}".repeat(Math.max(0, aG-cG));
    try{ return JSON.parse(cand); }catch(e){ base = base.slice(0, u); }
  }
  throw { msg:"L'elenco letto era incompleto e non sono riuscito a ricostruirlo. Riprova, se serve dividendo la bolla in due." };
}

/* riconoscimento fornitore dalla bolla: tollera umlaut (Woerndle/Worndle)
   e ragioni sociali (Srl, GmbH...) */
function piegaNome(s){
  return norm(s).replace(/[.,;:\u2019'\-\/]+/g," ").replace(/\s+/g," ").trim().replace(/\u00d6/g,"O").replace(/OE/g,"O").replace(/\u00dc/g,"U").replace(/UE/g,"U").replace(/\u00c4/g,"A").replace(/AE/g,"A");
}
function trovaFornitore(nomeLetto){
  const L = piegaNome(nomeLetto);
  if(!L) return null;
  return st.config.fornitori.find(f=>{
    const N = piegaNome(f.nome);
    return N && (L===N || L.includes(N) || N.includes(L));
  }) || null;
}
function trovaStruttura(nomeLetto){
  const L = piegaNome(nomeLetto);
  if(!L) return null;
  return st.config.strutture.find(s=>{
    const N = piegaNome(s.nome);
    return N && (L===N || L.includes(N) || N.includes(L));
  }) || null;
}
function pulisciNomeForn(s){
  let x = String(s).replace(/\s*[\/\-]\s*/g," ")
    .replace(/\b(S\.?R\.?L\.?|G\.?M\.?B\.?H\.?|S\.?P\.?A\.?|SNC|SAS|AG|KG|OHG|INTERSERVICE)\b/gi,"")
    .replace(/\s+/g," ").trim().replace(/^[\s.,\-]+|[\s.,\-]+$/g,"");
  if(!x) x = String(s).trim();
  return x.split(" ").map(w=>w ? w[0].toUpperCase()+w.slice(1).toLowerCase() : w).join(" ");
}

/* confronto bolla <-> ordine: nomi uguali (via catalogo) o molto simili */
function nomiSimili(a, b){
  const A = norm(a), B = norm(b);
  if(A === B) return true;
  const corto = A.length <= B.length ? A : B;
  const lungo = A.length <= B.length ? B : A;
  const parole = corto.split(" ").filter(w=>w.length>2);
  if(!parole.length) return false;
  return parole.every(w=>lungo.includes(w));
}
function confrontaBollaOrdine(o){
  const items = st.bolla.items;
  const attese = o.righe.filter(r=>r.ordinato);
  const righe = attese.length ? attese : o.righe;
  const usate = new Set();
  const ok = [], extra = [];
  items.forEach(i=>{
    const prod = st.catalogo.find(x=>norm(x.nome)===norm(i.nome)) || null;
    let r = prod ? righe.find(r=>!usate.has(r.id) && r.prodottoId===prod.id) : null;
    if(!r) r = righe.find(r=>!usate.has(r.id) && nomiSimili(r.nome, i.nome));
    if(r){ usate.add(r.id); ok.push({ riga:r, item:i }); }
    else extra.push(i);
  });
  const mancanti = righe.filter(r=>!usate.has(r.id));
  return { ok, extra, mancanti, ordineId:o.id };
}

  try{
    risposta = await fetch(PROXY_LETTURA_BOLLE,{
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1000,
        messages:[{ role:"user", content:[blocco, {type:"text", text:prompt}] }] }),
    });
  }catch(e){ throw { msg:"connessione al proxy non riuscita" }; }
  let data;
  try{ data = await risposta.json(); }catch(e){ throw { msg:"risposta non valida (stato "+risposta.status+")" }; }
  if(data.error) throw { msg:String(data.error.message||data.error.type||"errore del servizio") };
  const testo = (data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("\n");
  if(!testo.trim()) throw { msg:"documento non leggibile" };
  const json = estraiJSON(testo);
  const visti = new Set();
  const items = (json.prodotti||[]).map(p=>{
    const nome = norm(p.nome);
    const prezzo = (typeof p.prezzo==="number" && isFinite(p.prezzo) && p.prezzo>0) ? Math.round(p.prezzo*100)/100 : null;
    const prodotto = st.catalogo.find(x=>norm(x.nome)===nome) || null;
    return { nome, categoria: CATEGORIE.includes(p.categoria)?p.categoria:"Altro", prezzo, esiste: !!prodotto };
  }).filter(i=>{ if(!i.nome || visti.has(i.nome)) return false; visti.add(i.nome); return true; });
  if(!items.length) throw { msg:"nessun prodotto riconosciuto" };
  const nomeForn = json.fornitore ? String(json.fornitore).trim() : "";
  const fMatch = nomeForn ? trovaFornitore(nomeForn) : null;
  const nomeDest = json.destinatario ? String(json.destinatario).trim() : "";
  const sMatch = nomeDest ? trovaStruttura(nomeDest) : null;
  return { items, fornitoreId: fMatch ? fMatch.id : null,
    fornitoreNuovo: (nomeForn && !fMatch) ? pulisciNomeForn(nomeForn) : "",
    strutturaId: sMatch ? sMatch.id : "" };
}

/* applica una bolla senza revisione manuale (modalita' in serie) */
function applicaBollaAutomatica(an){
  const adesso = new Date().toISOString();
  let fornId = an.fornitoreId;
  if(!fornId && an.fornitoreNuovo){
    const gia = trovaFornitore(an.fornitoreNuovo);
    if(gia){ fornId = gia.id; }
    else {
      const f = { id:uid("f"), nome:an.fornitoreNuovo, telefono:"", preferito:false };
      st.config.fornitori.push(f); salvaConfig(); fornId = f.id;
    }
  }
  const strId = an.strutturaId || null;
  const variazioni = []; let aggiornati = 0;
  st.catalogo = st.catalogo.map(p=>{
    const i = an.items.find(x=>x.esiste && x.prezzo!=null && norm(x.nome)===norm(p.nome));
    if(!i) return p;
    const prec = (p.ultimoPrezzo!=null) ? p.ultimoPrezzo : null;
    if(prec!=null && Math.abs(i.prezzo-prec) <= 0.004) return p; /* invariato */
    if(prec!=null) variazioni.push({ nome:p.nome, da:prec, a:i.prezzo });
    aggiornati++;
    const voce = { data:adesso, prezzo:i.prezzo, fornitoreId:fornId||p.ultimoFornitoreId||null, fonte:"bolla" };
    return {...p, prezzi:[voce, ...(p.prezzi||[])].slice(0,20), ultimoPrezzo:i.prezzo,
      ultimoFornitoreId:fornId||p.ultimoFornitoreId||null, ultimaStrutturaId:strId||p.ultimaStrutturaId||null, ultimaData:adesso };
  });
  const nuovi = an.items.filter(i=>!i.esiste).map(i=>({
    id:uid("p"), nome:i.nome, categoria:i.categoria, note:"",
    ultimoFornitoreId:fornId, ultimaStrutturaId:strId, ultimoRepartoId:null,
    ultimaData:fornId?adesso:null, storico:[], origine:"bolla",
    ultimoPrezzo:(i.prezzo!=null?i.prezzo:null),
    prezzi:(i.prezzo!=null?[{ data:adesso, prezzo:i.prezzo, fornitoreId:fornId, fonte:"bolla" }]:[]),
  }));
  st.catalogo = [...st.catalogo, ...nuovi];
  return { fornitore: fornId ? (fornitore(fornId)?.nome||"") : "", struttura: strId ? (struttura(strId)?.nome||"") : "", aggiunti:nuovi.length, aggiornati, variazioni };
}

/* coda di elaborazione: piu' bolle in serie, salvataggio unico alla fine */
async function elaboraCoda(files){
  st.bolla = { fase:"batch", coda:files.length, corrente:0, fileNome:"", risultati:[], items:[], fornitoreId:"", errore:"" };
  render();
  for(let k=0; k<files.length; k++){
    st.bolla.corrente = k+1; st.bolla.fileNome = files[k].name; render();
    try{
      const an = await analizzaBollaFile(files[k]);
      const ris = applicaBollaAutomatica(an);
      st.bolla.risultati.push({ file:files[k].name, ok:true, ...ris });
    }catch(e){
      st.bolla.risultati.push({ file:files[k].name, ok:false, errore:(e && e.msg) ? e.msg : "lettura non riuscita" });
    }
  }
  salvaCatalogo();
  st.bolla = { fase:"esitoBatch", risultati:st.bolla.risultati, items:[], fornitoreId:"", errore:"" };
  render();
}

async function leggiBolla(file){
  st.bolla = { fase:"caricamento", items:[], fornitoreId:"", errore:"" };
  render();
  try{
    let blocco;
    if(file.type === "application/pdf"){
      if(file.size > 30*1024*1024) throw { msg:"Il PDF supera i 30 MB: riducilo o dividilo in più file." };
      blocco = { type:"document", source:{ type:"base64", media_type:"application/pdf", data: await leggiBase64(file) } };
    } else {
      const img = await comprimiImmagine(file);
      blocco = { type:"image", source:{ type:"base64", media_type: img.media, data: img.b64 } };
    }
    const prompt = 'Questa e\' una bolla di acquisto / documento di consegna (gastronomia e hotellerie).\n'
      +'Estrai ogni prodotto con: PREZZO UNITARIO in euro (colonna prezzo, NON l\'importo totale di riga), QUANTITA consegnata (colonna quantita) come numero, e unita di misura um (KG, NR, CAR, STK, GL, SA...). Usa null per i valori non leggibili. Se una descrizione e\' bilingue (italiano e tedesco), scrivi il nome UNA sola volta, senza accodare la traduzione. Ignora codici articolo, IVA, sconti e totali. Ignora il testo scritto a mano.\n'
      +'Se i prodotti sono piu\' di 40, elenca solo i primi 40.\n'
      +'Rispondi SOLO con JSON valido e COMPATTO (una sola riga), senza testo prima o dopo e senza backtick, in questo formato:\n'
      +'{"fornitore":"nome fornitore se leggibile, altrimenti null","destinatario":"nome della struttura o del destinatario di consegna (campo Destinatario/Destinazione) se leggibile, altrimenti null","prodotti":[{"nome":"NOME PRODOTTO IN MAIUSCOLO","categoria":"una tra: '+CATEGORIE.join(", ")+'","prezzo":12.34,"quantita":3,"um":"KG"}]}';
    if(!PROXY_LETTURA_BOLLE) throw { msg:"La lettura automatica delle bolle non e' configurata su questa installazione: manca l'URL del proxy (vedi README-pubblicazione, sezione Lettura bolle). Puoi comunque inserire i prodotti a mano dal catalogo." };
    let risposta;
    try{
      risposta = await fetch(PROXY_LETTURA_BOLLE,{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:1000,
          messages:[{ role:"user", content:[blocco, {type:"text", text:prompt}] }],
        }),
      });
    }catch(eRete){
      throw { msg:"Connessione al proxy di lettura non riuscita: controlla che l'URL configurato sia giusto e che il Worker sia attivo.", det:String(eRete && eRete.message || eRete) };
    }
    let data;
    try{ data = await risposta.json(); }
    catch(eJson){
      throw { msg:"Il servizio di lettura ha restituito una risposta non valida (stato "+risposta.status+"). Riprova tra qualche istante.", det:String(eJson && eJson.message || eJson) };
    }
    if(data.error) throw { msg:"Il servizio di lettura ha risposto con un errore. Riprova tra qualche istante.", det:String(data.error.message||data.error.type||"sconosciuto") };
    const testo = (data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("\n");
    if(!testo.trim()) throw { msg:"Il documento non è stato letto: riprova con una foto più nitida o un PDF." };
    const json = estraiJSON(testo);
    const visti = new Set();
    const items = (json.prodotti||[]).map(p=>{
      const nome = norm(p.nome);
      const prezzo = (typeof p.prezzo==="number" && isFinite(p.prezzo) && p.prezzo>0) ? Math.round(p.prezzo*100)/100 : null;
      const prodotto = st.catalogo.find(x=>norm(x.nome)===nome) || null;
      const prezzoPrec = (prodotto && prodotto.ultimoPrezzo!=null) ? prodotto.ultimoPrezzo : null;
      const variato = prezzo!=null && prezzoPrec!=null && Math.abs(prezzo-prezzoPrec) > 0.004;
      return {
        nome,
        categoria: CATEGORIE.includes(p.categoria)?p.categoria:"Altro",
        prezzo, prezzoPrec, variato,
        quantita: (typeof p.quantita==="number" && isFinite(p.quantita) && p.quantita>0) ? p.quantita : null,
        um: p.um ? String(p.um).trim().toUpperCase().slice(0,8) : null,
        esiste: !!prodotto,
        /* nuovi: sempre selezionati - esistenti: selezionati se c'e' un prezzo nuovo o cambiato */
        selezionato: !prodotto || (prezzo!=null && (prezzoPrec==null || variato)),
      };
    }).filter(i=>{
      if(!i.nome || visti.has(i.nome)) return false;
      visti.add(i.nome); return true;
    });
    if(!items.length) throw { msg:"Nessun prodotto riconosciuto nel documento: controlla che sia una bolla e che il testo sia leggibile." };
    const nomeForn = json.fornitore ? String(json.fornitore).trim() : "";
    const fMatch = nomeForn ? trovaFornitore(nomeForn) : null;
    const nomeDest = json.destinatario ? String(json.destinatario).trim() : "";
    const sMatch = nomeDest ? trovaStruttura(nomeDest) : null;
    st.bolla = { fase:"revisione", items,
      fornitoreId: fMatch ? fMatch.id : (nomeForn ? "__nuovo__" : ""),
      fornitoreNuovo: (nomeForn && !fMatch) ? pulisciNomeForn(nomeForn) : "",
      strutturaId: sMatch ? sMatch.id : "",
      errore:"" };
  }catch(e){
    st.bolla = { fase:"idle", items:[], fornitoreId:"",
      errore:(e && e.msg) ? e.msg : "Non sono riuscito a leggere la bolla. Riprova con una foto più nitida o un PDF.",
      dettaglio:(e && (e.det || e.message)) ? String(e.det || e.message) : "" };
  }
  render();
}

      +'<h2 style="font-size:20px;margin-bottom:10px">Controlla la configurazione</h2>'
      +'<p style="font-size:13px;color:var(--testo);margin-bottom:10px">L\'app si avvia ma non riesce a leggere il database Firebase. Le cause tipiche sono due:</p>'
      +'<p style="font-size:13px;color:var(--testo);margin-bottom:6px"><b>1. databaseURL sbagliata.</b> Apri Firebase &rarr; Realtime Database e copia l\'indirizzo mostrato in alto nella pagina; deve coincidere con la riga databaseURL dentro index.html.</p>'
      +'<p style="font-size:13px;color:var(--testo);margin-bottom:10px"><b>2. Regole non pubblicate.</b> Nella scheda Regole del database incolla le regole indicate nel README (ramo alpstay-ordini in lettura e scrittura) e premi Pubblica.</p>'
      +'<div class="err-box">'+esc(problema)+'</div>'
      +'<button class="btn btn-dark" onclick="location.reload()">Riprova</button>'
    : '<div class="eyebrow" style="margin-bottom:4px">Configurazione richiesta</div>'
      +'<h2 style="font-size:20px;margin-bottom:10px">Collega Firebase</h2>'
      +'<p style="font-size:13px;color:var(--testo);margin-bottom:10px">Questa copia non e\' ancora collegata al database. Apri il file <b>index.html</b> e incolla i dati del tuo progetto Firebase nel blocco <b>FIREBASE_CONFIG</b> in cima allo script, poi ricarica la pagina.</p>'
      +'<p style="font-size:12px;color:var(--grigio)">I passaggi completi sono nel file README-pubblicazione incluso.</p>';
  document.getElementById("app").innerHTML =
    '<header class="topbar"><div class="topbar-in"><div class="marchio-riga"><div class="marchio"><small>Alpstay / Gestione forniture</small><b>Ordini giornalieri</b></div></div></div></header>'
    +'<main><div class="card" style="padding:20px;margin-top:8px">'+corpo
    +'</div><footer class="piepagina">&copy; MP-ALPSTAY 08/2026</footer></main>';
}

/* verifica rapida che il database risponda (URL giusto e regole pubblicate) */
async function provaConnessione(){
  try{
    await Promise.race([
      rtdb.ref(RADICE).once("value"),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error("Nessuna risposta dal database entro 8 secondi (probabile databaseURL errata).")), 8000))
    ]);
    return "";
  }catch(e){ return String(e && e.message || e); }
}

(async function avvio(){
  /* evito che il browser apra i file trascinati fuori dalla zona di rilascio */
  ["dragover","drop"].forEach(t=>document.addEventListener(t, e=>e.preventDefault(), false));
  if(!avviaFirebase()){ schermataConfig(); return; }
  render();
  const problema = await provaConnessione();
  if(problema){ schermataConfig(problema); return; }
  st.config   = await caricaChiave(K_CONFIG,   { strutture:[], reparti:seedReparti, fornitori:seedFornitori });
  if(!Array.isArray(st.config.operatori)) st.config.operatori = [];

  /* L'elenco prodotti della prima lista non resta fisso nel codice:
     al primissimo avvio viene scritto UNA VOLTA SOLA nel catalogo generale
     sul database, e da quel momento il catalogo su Firebase e' l'unica
     fonte — i prodotti si modificano ed eliminano come tutti gli altri,
     e l'app non li reinserisce mai piu' da sola. */
  const K_INIZ = "catalogo-inizializzato";
  st.catalogo = await caricaChiave(K_CATALOGO, null);
  let versioneCat = await caricaChiave(K_INIZ, 0);
  if(versioneCat === true) versioneCat = 1; /* vecchio marcatore */
  /* v3: il fornitore Minus (bolle demo) entra in anagrafica se manca */
  if(versioneCat < 3 && !st.config.fornitori.some(f=>norm(f.nome)==="MINUS")){
    st.config.fornitori.push({ id:"f-minus", nome:"Minus", telefono:"", preferito:false });
    await salva(K_CONFIG, st.config);
  }
  if(st.catalogo === null){
    st.catalogo = versioneCat ? [] : seedCatalogo.concat(INTEGRAZIONE_V2, INTEGRAZIONE_V3);
    await salva(K_CATALOGO, st.catalogo);
    await salva(K_INIZ, 3);
  } else if(versioneCat < 3){
    /* integrazione UNA TANTUM: aggiunge solo le voci non gia' presenti,
       poi non tocca piu' nulla (le eliminazioni future restano rispettate) */
    const presenti = new Set(st.catalogo.map(p=>norm(p.nome)));
    const daIntegrare = (versioneCat < 2 ? INTEGRAZIONE_V2.concat(INTEGRAZIONE_V3) : INTEGRAZIONE_V3)
      .filter(p=>!presenti.has(norm(p.nome)));
    if(daIntegrare.length){
      st.catalogo = st.catalogo.concat(daIntegrare);
      await salva(K_CATALOGO, st.catalogo);
    }
    await salva(K_INIZ, 3);
  }
  if(versioneCat < 4){
    /* v4: prezzi delle bolle demo sulle voci gia' presenti senza storico prezzi */
    const mappa = new Map(INTEGRAZIONE_V3.map(p=>[norm(p.nome), p]));
    let toccato = false;
    st.catalogo = st.catalogo.map(p=>{
      const demo = mappa.get(norm(p.nome));
      if(demo && demo.ultimoPrezzo!=null && (!p.prezzi || !p.prezzi.length)){
        toccato = true;
        return {...p, prezzi: demo.prezzi.slice(), ultimoPrezzo: demo.ultimoPrezzo};
      }
      return p;
    });
    if(toccato) await salva(K_CATALOGO, st.catalogo);
    await salva(K_INIZ, 4);
  }

  st.ordini   = await caricaChiave(K_ORDINI,   []);
  st.caricamento = false;
  render();

  /* promemoria scadenze: controllo ogni minuto mentre l'app e' aperta */
  st.notificheInviate = new Set();
  const controllaScadenze = ()=>{
    if(!("Notification" in window) || Notification.permission!=="granted") return;
    scadenzeOggi().forEach(s=>{
      const m = minutiA(s.entro);
      const kBase = new Date().toDateString()+"|"+s.f.id+"|"+s.c.giorno;
      if(m<=60 && m>5 && !st.notificheInviate.has(kBase+"|pre")){
        st.notificheInviate.add(kBase+"|pre");
        try{ new Notification("Ordini giornalieri", { body:"Entro le "+s.entro+": ordine "+s.f.nome+" (consegna "+GIORNI_BREVI[s.c.giorno].toLowerCase()+")" }); }catch(e){}
      }
      if(m<=5 && m>-10 && !st.notificheInviate.has(kBase+"|ora")){
        st.notificheInviate.add(kBase+"|ora");
        try{ new Notification("Ordini giornalieri", { body:"Ultimo momento: entro le "+s.entro+" l'ordine "+s.f.nome }); }catch(e){}
      }
    });
  };
  controllaScadenze();
  setInterval(controllaScadenze, 60000);
})();
